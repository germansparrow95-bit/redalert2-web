<script>
/* src/core/ai.js */
/*
 * Red Alert Web - the computer opponent.
 *
 * The AI plays through exactly the same API as the human player: it queues
 * builds, places structures, trains units and issues attack-move orders.  It
 * respects its own fog of war, so it only reacts to what it has actually seen.
 *
 * Difficulty changes behaviour (thinking speed, production speed, wave size)
 * instead of giving it free money.
 */
(function (RA) {
  'use strict';

  var U = RA.Util;
  var Rules = RA.Rules;
  var Sim = RA.Sim;
  var MapGen = RA.MapGen;

  var AI = RA.AI = {};

  function createBrain(p) {
    return {
      thinkInterval: p.difficulty === 'hard' ? 9 : (p.difficulty === 'easy' ? 20 : 14),
      armyTarget: 0,
      waveSize: 0,
      wave: null,
      lastWaveTick: 0,
      lastScoutTick: 0,
      lastExpandTick: 0,
      baseX: 0, baseY: 0,
      lastDefenseTick: 0,
      panic: 0,
      defenderIds: [],
      attackTargets: [],
      stuckTicks: 0
    };
  }

  AI.update = function (state) {
    for (var i = 0; i < state.players.length; i++) {
      var p = state.players[i];
      if (!p.isAI || p.defeated) continue;
      if (!p.ai) p.ai = createBrain(p);
      if ((state.tick + p.index * 5) % p.ai.thinkInterval !== 0) continue;
      try {
        think(state, p);
      } catch (err) {
        // An AI error must never take the match down: log it and carry on.
        if (typeof console !== 'undefined' && console.warn) console.warn('AI error', err);
        Sim.addEvent(state, { type: 'aiError', player: p.index, message: String(err && err.message || err) });
      }
    }
  };

  // ---------------------------------------------------------------------
  // Information gathering
  // ---------------------------------------------------------------------
  function ownUnits(state, idx) {
    var out = [];
    for (var i = 0; i < state.units.length; i++) {
      var u = state.units[i];
      if (!u.dead && u.owner === idx) out.push(u);
    }
    return out;
  }

  function baseCenter(state, p, units, buildings) {
    for (var i = 0; i < buildings.length; i++) {
      if (buildings[i].type === 'conyard') return { x: buildings[i].cx, y: buildings[i].cy };
    }
    if (buildings.length) return { x: buildings[0].cx, y: buildings[0].cy };
    if (units.length) return { x: units[0].x, y: units[0].y };
    var st = state.map.starts[p.index] || { x: state.map.w / 2, y: state.map.h / 2 };
    return { x: st.x, y: st.y };
  }

  function knownEnemyBuildings(state, p) {
    var out = [];
    for (var i = 0; i < state.buildings.length; i++) {
      var b = state.buildings[i];
      if (b.dead || b.owner === p.index) continue;
      if (!Sim.isEntityKnown(state, p.index, b)) continue;
      out.push(b);
    }
    return out;
  }

  function visibleEnemies(state, p) {
    var out = [];
    for (var i = 0; i < state.units.length; i++) {
      var u = state.units[i];
      if (u.dead || u.owner === p.index) continue;
      if (!Sim.isEntityVisible(state, p.index, u)) continue;
      out.push(u);
    }
    return out;
  }

  function threatsNear(state, p, x, y, radius) {
    var out = [];
    for (var i = 0; i < state.units.length; i++) {
      var u = state.units[i];
      if (u.dead || u.owner === p.index) continue;
      if (!Sim.isEntityVisible(state, p.index, u)) continue;
      if (U.dist(u.x, u.y, x, y) > radius) continue;
      if (!Sim.primaryWeapon(u)) continue;
      out.push(u);
    }
    return out;
  }

  /**
   * Flood fill of the tiles the AI's army can actually walk to.  Attacking a
   * building that sits behind a sealed wall would stall a wave forever, so the
   * AI always picks an objective it can reach (the wall itself, for example).
   */
  function reachableTiles(state, p, base) {
    var brain = p.ai;
    if (brain.reach && state.tick - (brain.reachTick || -1e9) < 60) return brain.reach;
    brain.reachTick = state.tick;
    var map = state.map;
    var seen = brain.reach || new Uint8Array(map.w * map.h);
    seen.fill(0);
    var start = RA.Pathfind.nearestFreeTile(map, Math.floor(base.x), Math.floor(base.y), 12);
    if (!start) return seen;
    var stack = [start.y * map.w + start.x];
    seen[stack[0]] = 1;
    while (stack.length) {
      var i = stack.pop();
      var x = i % map.w, y = (i - x) / map.w;
      var nb = [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]];
      for (var k = 0; k < 4; k++) {
        var nx = nb[k][0], ny = nb[k][1];
        if (!map.inside(nx, ny)) continue;
        var ni = ny * map.w + nx;
        if (seen[ni]) continue;
        if (map.isBlockedTile(nx, ny)) continue;
        seen[ni] = 1;
        stack.push(ni);
      }
    }
    brain.reach = seen;
    return seen;
  }

  /** True when at least one tile next to the building can be walked to. */
  function structureReachable(state, seen, b) {
    var map = state.map;
    for (var y = -1; y <= b.h; y++) {
      for (var x = -1; x <= b.w; x++) {
        var insideX = x >= 0 && x < b.w, insideY = y >= 0 && y < b.h;
        if (insideX && insideY) continue;
        var tx = b.x + x, ty = b.y + y;
        if (!map.inside(tx, ty)) continue;
        if (seen[ty * map.w + tx]) return true;
      }
    }
    return false;
  }

  // ---------------------------------------------------------------------
  // Placement
  // ---------------------------------------------------------------------
  /**
   * Try to place `typeId` for `playerIdx`.  Scores candidate tiles by distance
   * to a hint position plus bonuses for hugging the existing base, then tells
   * the simulation to drop the building there.
   */
  function tryPlace(state, p, typeId, hintX, hintY, radius, weight) {
    var def = Rules.get(typeId);
    if (!def) return false;
    weight = weight || {};
    var best = null, bestScore = 1e9;
    var r0 = Math.max(1, Math.floor(radius || 9));
    var cx = Math.floor(hintX), cy = Math.floor(hintY);
    for (var r = 0; r <= r0; r++) {
      for (var oy = -r; oy <= r; oy++) {
        for (var ox = -r; ox <= r; ox++) {
          if (r > 1 && Math.max(Math.abs(ox), Math.abs(oy)) !== r) continue;
          var tx = cx + ox, ty = cy + oy;
          if (!Sim.canPlace(state, p.index, typeId, tx, ty).ok) continue;
          var mx = tx + def.w / 2, my = ty + def.h / 2;
          var score = 0;
          score += U.dist(mx, my, hintX, hintY) * (weight.hintWeight === undefined ? 1 : weight.hintWeight);
          if (weight.oreWeight) {
            var ore = MapGen.findOre(state.map, mx, my, 24);
            score += ore ? U.dist(mx, my, ore.x, ore.y) * weight.oreWeight : 60 * weight.oreWeight;
          }
          if (weight.centerWeight) {
            score += U.dist(mx, my, state.map.w / 2, state.map.h / 2) * weight.centerWeight;
          }
          if (weight.spreadWeight) {
            for (var k = 0; k < state.buildings.length; k++) {
              var b = state.buildings[k];
              if (b.dead || b.owner !== p.index) continue;
              if (b.type === typeId) score += Math.max(0, 6 - U.dist(mx, my, b.cx, b.cy)) * weight.spreadWeight;
            }
          }
          if (score < bestScore) { bestScore = score; best = { x: tx, y: ty }; }
        }
      }
      if (best && r >= 1) break;
    }
    if (!best) return false;
    var res = Sim.placeBuilding(state, p.index, typeId, best.x, best.y);
    return !!res.ok;
  }

  function handleReadyStructures(state, p, base) {
    for (var t = 0; t < Rules.TAB_ORDER.length; t++) {
      var tab = Rules.TAB_ORDER[t];
      var q = p.queues[tab];
      if (!q.length || !q[0].ready) continue;
      var typeId = q[0].typeId;
      var def = Rules.get(typeId);
      var hint = { x: base.x, y: base.y };
      var weight = { hintWeight: 1 };
      if (typeId === 'refinery') {
        var ore = nearestRichOre(state, base);
        if (ore) {
          var ang = Math.atan2(ore.y - base.y, ore.x - base.x);
          hint = { x: base.x + Math.cos(ang) * 5, y: base.y + Math.sin(ang) * 5 };
        }
        weight = { hintWeight: 0.6, oreWeight: 1.4 };
      } else if (tab === 'defenses') {
        var toward = threatDirection(state, p, base);
        hint = { x: base.x + Math.cos(toward) * 5.5, y: base.y + Math.sin(toward) * 5.5 };
        weight = { hintWeight: 1.0, spreadWeight: 1.2 };
      } else if (typeId === 'barracks' || typeId === 'warfactory' || typeId === 'lab') {
        hint = { x: base.x + state.rng() * 6 - 3, y: base.y + state.rng() * 6 - 3 };
        weight = { hintWeight: 1.0, spreadWeight: 0.8 };
      } else if (typeId === 'allied_power' || typeId === 'soviet_power') {
        hint = { x: base.x - 4 + state.rng() * 2, y: base.y - 4 + state.rng() * 2 };
        weight = { hintWeight: 1.0, spreadWeight: 0.6 };
      }
      if (!tryPlace(state, p, typeId, hint.x, hint.y, 11, weight)) {
        // Fall back to a wider search around the base.
        tryPlace(state, p, typeId, base.x, base.y, 16, { hintWeight: 1 });
      }
      break;   // one structure per think tick
    }
  }

  function nearestRichOre(state, base) {
    var best = null, bestScore = -1e9;
    var step = 4;
    for (var y = 2; y < state.map.h - 2; y += step) {
      for (var x = 2; x < state.map.w - 2; x += step) {
        var i = state.map.idx(x, y);
        if (state.map.ore[i] <= 0) continue;
        var d = U.dist(x, y, base.x, base.y);
        if (d > 34) continue;
        var score = state.map.ore[i] - d * 5;
        if (score > bestScore) { bestScore = score; best = { x: x, y: y, amount: state.map.ore[i] }; }
      }
    }
    return best;
  }

  /** Rough direction (radians) the AI should point its defences at. */
  function threatDirection(state, p, base) {
    var enemies = knownEnemyBuildings(state, p);
    var bx = 0, by = 0, n = 0;
    for (var i = 0; i < enemies.length; i++) {
      bx += enemies[i].cx; by += enemies[i].cy; n++;
    }
    if (n) return Math.atan2(by / n - base.y, bx / n - base.x);
    var st = state.map.starts[p.index];
    if (st) return Math.atan2(state.map.h / 2 - base.y, state.map.w / 2 - base.x);
    return 0;
  }

  // ---------------------------------------------------------------------
  // Build decisions
  // ---------------------------------------------------------------------
  function buildingCount(state, p, typeId) {
    return Sim.buildingCount(state, p.index, typeId, false);
  }
  function producerCount(state, p, kind) {
    var n = 0;
    for (var i = 0; i < state.buildings.length; i++) {
      var b = state.buildings[i];
      if (!b.dead && b.owner === p.index && b.produceType === kind) n++;
    }
    return n;
  }
  function queuedCount(state, p, typeId) {
    var n = 0;
    for (var t = 0; t < Rules.TAB_ORDER.length; t++) {
      var q = p.queues[Rules.TAB_ORDER[t]];
      for (var i = 0; i < q.length; i++) if (q[i].typeId === typeId) n++;
    }
    return n;
  }
  function hasReadyOrQueued(state, p, typeId) {
    return queuedCount(state, p, typeId) > 0;
  }

  function queue(state, p, typeId) {
    if (hasReadyOrQueued(state, p, typeId)) return false;
    var check = Sim.canBuild(state, p.index, typeId);
    if (!check.ok) return false;
    return Sim.queueBuild(state, p.index, typeId);
  }

  function powerPlantType(p) { return p.faction === 'soviet' ? 'soviet_power' : 'allied_power'; }
  function radarType(p) { return p.faction === 'soviet' ? 'soviet_radar' : 'allied_radar'; }
  function aatype(p) { return p.faction === 'soviet' ? 'soviet_flak' : 'allied_patriot'; }
  function minerType(p) { return p.faction === 'soviet' ? 'warminer' : 'harvester'; }
  function superTypes(p) {
    return p.faction === 'soviet'
      ? ['soviet_ironcurtain', 'soviet_nuke']
      : ['allied_chronosphere', 'allied_weather'];
  }

  function powerPressure(state, p, buildings) {
    var produced = p.power.produced, consumed = p.power.consumed;
    return consumed + 40 - produced;     // 40 = roughly one more structure
  }

  function decideConstruction(state, p, buildings, units, base) {
    var diff = Rules.DIFFICULTIES[p.difficulty];
    var refineries = buildingCount(state, p, 'refinery');
    var factories = buildingCount(state, p, 'warfactory');
    var barracks = buildingCount(state, p, 'barracks');
    var labs = buildingCount(state, p, 'lab');
    var defenses = buildingCount(state, p, 'allied_pillbox') + buildingCount(state, p, 'allied_patriot') +
      buildingCount(state, p, 'soviet_sentry') + buildingCount(state, p, 'soviet_flak') +
      buildingCount(state, p, 'allied_prism') + buildingCount(state, p, 'soviet_tesla');
    var ptype = powerPlantType(p);
    var miners = 0;
    for (var i = 0; i < units.length; i++) if (units[i].def.capacity) miners++;

    // keep the grid up first
    if ((p.power.low || powerPressure(state, p, buildings) > 0) && queue(state, p, ptype)) return;
    if (refineries < 1 && queue(state, p, 'refinery')) return;
    if (barracks < 1 && queue(state, p, 'barracks')) return;
    if (factories < 1 && queue(state, p, 'warfactory')) return;

    var wantMiners = (p.difficulty === 'easy' ? 2 : (p.difficulty === 'hard' ? 5 : 3)) + Math.max(0, refineries - 1);
    if (miners < wantMiners && factories > 0 && queue(state, p, minerType(p))) return;

    // 雷达站：原版里没雷达就没有小地图，AI 也会尽早补上
    if (buildingCount(state, p, radarType(p)) === 0 && p.credits > 1500 && miners >= 2 &&
      queue(state, p, radarType(p))) return;

    if (diff.waveMul >= 1 && defenses < 2 && queue(state, p, defenseType(p, false))) return;

    if (refineries < 2 && p.credits > 3200 && queue(state, p, 'refinery')) return;
    if (factories < 2 && p.credits > 4000 && queue(state, p, 'warfactory')) return;
    if (labs < 1 && p.credits > 3400 && queue(state, p, 'lab')) return;

    // 矿石精炼器（+25% 收益）与维修厂
    if (buildingCount(state, p, 'ore_purifier') === 0 && p.credits > 3200 &&
      queue(state, p, 'ore_purifier')) return;
    if (buildingCount(state, p, 'service_depot') === 0 && factories > 0 &&
      p.credits > 2000 && queue(state, p, 'service_depot')) return;

    // 超级武器：一旦有作战实验室就抢建
    if (labs > 0 && p.credits > 3200) {
      var sw = superTypes(p);
      for (var si = 0; si < sw.length; si++) {
        if (queue(state, p, sw[si])) return;
      }
    }

    // 防空：发现敌方空军就补防空
    if (enemyAirCount(state, p) > 0 && !hasReadyOrQueued(state, p, aatype(p)) &&
      p.credits > 1200 && queue(state, p, aatype(p))) return;

    if (defenses < 4 && p.credits > 2200 && queue(state, p, defenseType(p, labs > 0))) return;
    if (refineries < 3 && p.credits > 6000 && queue(state, p, 'refinery')) return;
    if (barracks < 2 && p.credits > 2500 && queue(state, p, 'barracks')) return;

    // 电力吃紧：优先上高级电厂 / 核反应堆（但别把造矿车的钱花光）
    if (p.power.low || (p.power.consumed + 60 > p.power.produced && p.credits > 2600)) {
      if (p.faction === 'soviet' && labs > 0 && queue(state, p, 'soviet_nuclear')) return;
      if (p.faction === 'allied' && queue(state, p, 'allied_adv_power')) return;
      if (queue(state, p, ptype)) return;
    }
  }

  /** 看得见的敌方飞行单位数量。 */
  function enemyAirCount(state, p) {
    var n = 0;
    for (var i = 0; i < state.units.length; i++) {
      var u = state.units[i];
      if (u.dead || u.owner === p.index || !u.def.flying) continue;
      if (Sim.isEntityVisible(state, p.index, u)) n++;
    }
    return n;
  }

  function defenseType(p, advanced) {
    if (advanced) return p.faction === 'soviet' ? 'soviet_tesla' : 'allied_prism';
    return p.faction === 'soviet' ? 'soviet_sentry' : 'allied_pillbox';
  }

  function decideProduction(state, p, buildings, units, base) {
    var lab = buildingCount(state, p, 'lab') > 0;
    var army = 0, miners = 0;
    var spies = 0;
    for (var i = 0; i < units.length; i++) {
      var u = units[i];
      if (u.def.capacity) { miners++; continue; }
      if (u.type === 'spy') spies++;
      if (Sim.primaryWeapon(u)) army++;
    }

    // 经济优先：缺矿车而且一时买不起时，先攒钱，不要把余钱全砸进部队
    var refineries = buildingCount(state, p, 'refinery');
    var wantMiners = (p.difficulty === 'easy' ? 2 : (p.difficulty === 'hard' ? 5 : 3)) +
      Math.max(0, refineries - 1);
    var minerId = minerType(p);
    if (miners < wantMiners && !hasReadyOrQueued(state, p, minerId) &&
      p.credits < Rules.get(minerId).cost + 300) {
      return;
    }

    // 科技优先：钱不够时先攒着上作战实验室 / 超级武器，别把钱全变成兵
    var labCount = buildingCount(state, p, 'lab');
    var swCount = 0;
    var swTypes = superTypes(p);
    for (var swi = 0; swi < swTypes.length; swi++) swCount += buildingCount(state, p, swTypes[swi]);
    var hasProducer = producerCount(state, p, 'vehicle') > 0;
    if (hasProducer) {
      if (labCount === 0 && !hasReadyOrQueued(state, p, 'lab') && army >= 6 && p.credits < 3600) return;
      if (labCount > 0 && swCount === 0 && army >= 8 && p.credits < 3400) return;
    }

    var diff = Rules.DIFFICULTIES[p.difficulty];
    var target = Math.round((6 + state.tick / (HZ2() * 45)) * diff.waveMul);
    target = U.clamp(target, 4, p.difficulty === 'hard' ? 40 : (p.difficulty === 'easy' ? 16 : 30));
    p.ai.armyTarget = target;

    if (producerCount(state, p, 'infantry') > 0 && army < target) {
      var infType = pickInfantry(p, lab, state);
      if (queue(state, p, infType)) return;
    }
    if (producerCount(state, p, 'vehicle') > 0 && army < target) {
      var vehType = pickVehicle(state, p, lab, army);
      if (queue(state, p, vehType)) return;
    }
    // 盟军偶尔派间谍去偷钱 / 断电（一次性单位，保持 1 个以内）
    if (p.faction === 'allied' && lab && spies === 0 && p.credits > 3000 && state.rng() < 0.3) {
      if (queue(state, p, 'spy')) return;
    }
  }

  function HZ2() { return Rules.TICKS_PER_SEC; }

  function pickInfantry(p, lab, state) {
    var r = state.rng();
    if (p.faction === 'soviet') {
      if (r < 0.3) return 'conscript';
      if (r < 0.42) return 'tesla_trooper';
      return 'flak';
    }
    if (lab && r < 0.3) return 'guardian';
    if (lab && r < 0.42) return 'rocketeer';
    return 'gi';
  }

  function pickVehicle(state, p, lab, army) {
    var r = state.rng();
    if (p.faction === 'soviet') {
      if (lab && r < 0.2) return 'apoc';
      if (lab && r < 0.32) return 'v3';
      if (r < 0.48) return 'flaktrack';
      return 'rhino';
    }
    if (lab && r < 0.2) return 'mirage';
    if (lab && r < 0.32) return 'prismtank';
    if (r < 0.48) return 'ifv';
    return 'grizzly';
  }

  // ---------------------------------------------------------------------
  // Military
  // ---------------------------------------------------------------------
  function isCombatUnit(u) {
    return !!Sim.primaryWeapon(u) || (u.def.abilities && u.def.abilities.indexOf('capture') >= 0);
  }

  function decideMilitary(state, p, units, base) {
    var diff = Rules.DIFFICULTIES[p.difficulty];
    var army = [];
    var i;
    for (i = 0; i < units.length; i++) {
      var u = units[i];
      if (u.def.capacity) {
        // 矿车被打就跑回基地（原版矿车不会傻站着挨打）
        if (u.hp < u.maxHp * 0.65) {
          var flee = threatsNear(state, p, u.x, u.y, 6);
          if (flee.length) {
            var refuge = nearestOwnBuilding(state, p, u.x, u.y);
            if (refuge) {
              Sim.issueOrder(state, p.index, [u.id], { type: 'move', x: refuge.cx, y: refuge.cy });
              continue;
            }
          }
        }
        if (!u.dead && (!u.order || (u.order.type !== 'harvest' && u.order.type !== 'dock' && u.order.type !== 'move')) &&
          u.state !== 'harvesting' && u.state !== 'return' && u.state !== 'docking') {
          Sim.issueOrder(state, p.index, [u.id], { type: 'harvest' });
        }
        continue;
      }
      if (isCombatUnit(u)) army.push(u);
    }

    var brain = p.ai;
    var waveSet = new Set(brain.wave && brain.wave.members ? brain.wave.members : []);

    // --- defence ------------------------------------------------------
    // Raiders are dealt with by a slice of the army; the rest keeps pressing.
    var threats = threatsNear(state, p, base.x, base.y, 16);
    var defSet = new Set();
    if (threats.length) {
      var tx = 0, ty = 0, threatValue = 0;
      for (i = 0; i < threats.length; i++) {
        tx += threats[i].x; ty += threats[i].y;
        threatValue += threats[i].def.cost || 200;
      }
      tx /= threats.length; ty /= threats.length;
      var cap = Math.max(2, Math.ceil(army.length * (threatValue > 1500 ? 0.6 : 0.4)));
      var cands = [];
      for (i = 0; i < army.length; i++) {
        var a = army[i];
        if (waveSet.has(a.id)) continue;
        if (U.dist(a.x, a.y, base.x, base.y) > 26) continue;
        cands.push(a);
      }
      cands.sort(function (x, y) { return U.dist2(x.x, x.y, tx, ty) - U.dist2(y.x, y.y, tx, ty); });
      var defIds = [];
      for (i = 0; i < cands.length && defIds.length < cap; i++) {
        defIds.push(cands[i].id);
        defSet.add(cands[i].id);
      }
      if (defIds.length) Sim.issueOrder(state, p.index, defIds, { type: 'attackMove', x: tx, y: ty });
    }

    // --- offensive waves ---------------------------------------------
    var field = [];
    for (i = 0; i < army.length; i++) {
      if (!defSet.has(army[i].id)) field.push(army[i]);
    }
    // Bigger waves when the enemy has turtled up, and escalate after losses.
    var enemyDefenses = 0;
    var knownB = knownEnemyBuildings(state, p);
    for (i = 0; i < knownB.length; i++) {
      if (knownB[i].def.tags && knownB[i].def.tags.indexOf('defense') >= 0) enemyDefenses++;
    }
    var waveSize = Math.round((5 + state.tick / (HZ2() * 60)) * diff.waveMul);
    waveSize = U.clamp(waveSize, 3, p.difficulty === 'hard' ? 18 : 12);
    waveSize += (brain.waveBoost || 0) * 1.6 + Math.min(8, enemyDefenses * 1.2);
    waveSize = Math.min(30, Math.round(waveSize));
    var ready = field.length >= waveSize;
    var cooldown = (p.difficulty === 'hard' ? 12 : (p.difficulty === 'easy' ? 40 : 22)) * HZ2();
    var canAttack = state.tick - brain.lastWaveTick > cooldown;
    // Grace period: the human gets a few minutes to find their feet before the
    // first assault rolls in.
    var grace = (p.difficulty === 'hard' ? 2 : (p.difficulty === 'easy' ? 5 : 3)) * 60 * HZ2();
    if (state.tick < grace) canAttack = false;
    // Never sit on a big army forever just because the target keeps growing.
    if (!ready && field.length >= 4 && state.tick - brain.lastWaveTick > 4 * 60 * HZ2()) {
      ready = true;
      waveSize = field.length;
    }

    if (brain.wave) {
      if (brain.wave.sweep) {
        // Recon in force: walk the army onto an enemy start position.
        var arrived = false;
        for (i = 0; i < field.length; i++) {
          if (U.dist(field[i].x, field[i].y, brain.wave.x, brain.wave.y) < 9) { arrived = true; break; }
        }
        var spotted = pickAttackTarget(state, p, base);
        var stale = state.tick - brain.lastWaveTick > 60 * HZ2();
        if (arrived || stale || spotted) {
          brain.wave = spotted
            ? { targetId: spotted.id, x: spotted.kind === 'building' ? spotted.cx : spotted.x, y: spotted.kind === 'building' ? spotted.cy : spotted.y }
            : null;
          brain.lastWaveTick = state.tick;
        }
      } else {
        var keep = [];
        var aliveAttackers = 0;
        var memberIds = brain.wave.members || [];
        for (i = 0; i < memberIds.length; i++) {
          var mu = Sim.byId(state, memberIds[i]);
          if (mu && !mu.dead) { keep.push(memberIds[i]); aliveAttackers++; }
        }
        brain.wave.members = keep;
        var targetEnt = Sim.byId(state, brain.wave.targetId);
        if (!targetEnt || targetEnt.dead) {
          brain.waveBoost = Math.max(0, (brain.waveBoost || 0) - 1);
          brain.wave = null;
          brain.lastWaveTick = state.tick;
        } else if (aliveAttackers < Math.max(2, Math.ceil(memberIds.length * 0.35))) {
          // The assault was wiped out: come back with more next time.
          brain.waveBoost = Math.min(10, (brain.waveBoost || 0) + 1);
          brain.wave = null;
          brain.lastWaveTick = state.tick;
        } else if (state.tick - (brain.wave.startedAt || 0) > 75 * HZ2()) {
          // The wave is going nowhere (blocked route, unbreakable defence):
          // shelve that objective for a while and hit something else.
          if (!brain.badTargets) brain.badTargets = {};
          brain.badTargets[brain.wave.targetId] = state.tick;
          brain.waveBoost = Math.min(10, (brain.waveBoost || 0) + 1);
          brain.wave = null;
          brain.lastWaveTick = state.tick;
        }
      }
    }

    if (!brain.wave && ready && canAttack) {
      var target = pickAttackTarget(state, p, base);
      if (target) {
        brain.wave = {
          targetId: target.id,
          x: target.kind === 'building' ? target.cx : target.x,
          y: target.kind === 'building' ? target.cy : target.y,
          members: chooseWaveMembers(field, base, waveSize, state),
          startedAt: state.tick
        };
        brain.lastWaveTick = state.tick;
      } else {
        // Nothing is known yet: sweep the enemy start positions until we find them.
        var sweeps = Math.max(1, state.playerCount - 1);
        var idx = (brain.sweepIndex || 0) % sweeps;
        brain.sweepIndex = idx + 1;
        var st = state.map.starts[(p.index + 1 + idx) % state.playerCount] || state.map.starts[0];
        brain.wave = {
          targetId: 0, x: st.x, y: st.y, sweep: true,
          members: chooseWaveMembers(field, base, waveSize, state), startedAt: state.tick
        };
        brain.lastWaveTick = state.tick;
      }
    }

    if (brain.wave) {
      var wt = Sim.byId(state, brain.wave.targetId);
      if (wt && !wt.dead) {
        brain.wave.x = wt.kind === 'building' ? wt.cx : wt.x;
        brain.wave.y = wt.kind === 'building' ? wt.cy : wt.y;
      }
      var ids = [];
      var members = brain.wave.members || [];
      for (i = 0; i < members.length; i++) {
        var cu = Sim.byId(state, members[i]);
        if (!cu || cu.dead) continue;
        var o = cu.order || {};
        if (!brain.wave.sweep && o.type === 'attack' && o.targetId === brain.wave.targetId) continue;
        if (o.type === 'attackMove' && U.dist(o.x, o.y, brain.wave.x, brain.wave.y) < 5) continue;
        ids.push(cu.id);
      }
      if (ids.length) {
        Sim.issueOrder(state, p.index, ids, {
          type: 'attackMove', x: brain.wave.x, y: brain.wave.y
        });
      }
      var wtp = Sim.byId(state, brain.wave.targetId);
      if (wtp && !wtp.dead) {
        var inRange = [];
        for (i = 0; i < members.length; i++) {
          var fu = Sim.byId(state, members[i]);
          if (fu && !fu.dead && U.dist(fu.x, fu.y, brain.wave.x, brain.wave.y) < 8) inRange.push(fu.id);
        }
        if (inRange.length) Sim.issueOrder(state, p.index, inRange, { type: 'attack', targetId: brain.wave.targetId });
      }
    }

    // --- scouting -----------------------------------------------------
    if (state.tick - brain.lastScoutTick > 25 * HZ2()) {
      brain.lastScoutTick = state.tick;
      var scout = null;
      for (i = 0; i < units.length; i++) {
        var s = units[i];
        if (s.def.capacity || !isCombatUnit(s)) continue;
        if (s.def.cost > 400) continue;
        if (s.order && (s.order.type === 'attackMove' || s.order.type === 'attack')) continue;
        scout = s; break;
      }
      if (scout) {
        var st = state.map.starts[(p.index + 1 + state.rng.int(state.playerCount - 1)) % state.playerCount];
        Sim.issueOrder(state, p.index, [scout.id], { type: 'attackMove', x: st.x, y: st.y });
      }
    }

    // Idle units gather near the base so the army stays together.
    var idle = [];
    for (i = 0; i < field.length; i++) {
      var q = field[i];
      if (q.path) continue;
      if (q.order && (q.order.type === 'attackMove' || q.order.type === 'move' || q.order.type === 'attack')) continue;
      if (U.dist(q.x, q.y, base.x, base.y) > 12) idle.push(q.id);
    }
    if (idle.length > 4) {
      var gatherAngle = state.rng() * U.TAU;
      Sim.issueOrder(state, p.index, idle, {
        type: 'move',
        x: base.x + Math.cos(gatherAngle) * 6,
        y: base.y + Math.sin(gatherAngle) * 6
      });
    }
  }

  function idOf(u) { return u.id; }

  /** 离某点最近的自有建筑（矿车避难用）。 */
  function nearestOwnBuilding(state, p, x, y) {
    var best = null, bestD = 1e9;
    for (var i = 0; i < state.buildings.length; i++) {
      var b = state.buildings[i];
      if (b.dead || b.owner !== p.index) continue;
      var d = U.dist2(x, y, b.cx, b.cy);
      if (d < bestD) { bestD = d; best = b; }
    }
    return best;
  }

  /**
   * Who marches out in this wave?  The bulk of the army, leaving a small
   * garrison behind - and the members are frozen so reinforcements pile up at
   * home instead of feeding themselves into the grinder one by one.
   */
  function chooseWaveMembers(field, base, waveSize, state) {
    var sorted = field.slice().sort(function (a, b) {
      return U.dist(a.x, a.y, base.x, base.y) - U.dist(b.x, b.y, base.x, base.y);
    });
    var garrison = Math.max(1, Math.floor(sorted.length * 0.2));
    var take = Math.max(waveSize, Math.floor(sorted.length * 0.75));
    take = Math.min(take, Math.max(1, sorted.length - garrison));
    return sorted.slice(0, take).map(idOf);
  }

  function pickAttackTarget(state, p, base) {
    var best = null, bestScore = 1e9;
    var i;
    var eb = knownEnemyBuildings(state, p);
    var seen = reachableTiles(state, p, base);
    var brain = p.ai;
    var now = state.tick;
    for (i = 0; i < eb.length; i++) {
      var b = eb[i];
      if (!structureReachable(state, seen, b)) continue;
      var ban = brain.badTargets && brain.badTargets[b.id];
      if (ban && now - ban < 120 * HZ2()) continue;
      var d = U.dist(b.cx, b.cy, base.x, base.y);
      var score = d;
      if (b.type === 'refinery') score -= 6;
      if (b.type === 'warfactory') score -= 4;
      if (b.type === 'conyard') score -= 3;
      if (b.type === 'conyard' && state.shortGame) score -= 14;
      if (b.type.indexOf('power') >= 0) score -= 5;
      if (score < bestScore) { bestScore = score; best = b; }
    }
    if (best) return best;
    var ev = visibleEnemies(state, p);
    best = null; bestScore = 1e9;
    for (i = 0; i < ev.length; i++) {
      if (seen[Math.floor(ev[i].y) * state.map.w + Math.floor(ev[i].x)] === 0) continue;
      var d2 = U.dist(ev[i].x, ev[i].y, base.x, base.y);
      if (d2 < bestScore) { bestScore = d2; best = ev[i]; }
    }
    if (best) return best;
    // Everything behind walls: smash the nearest known structure, reachable or not.
    for (i = 0; i < eb.length; i++) {
      var b2 = eb[i];
      var ban2 = brain.badTargets && brain.badTargets[b2.id];
      if (ban2 && now - ban2 < 120 * HZ2()) continue;
      var d3 = U.dist(b2.cx, b2.cy, base.x, base.y);
      if (d3 < bestScore) { bestScore = d3; best = b2; }
    }
    return best;
  }

  // ---------------------------------------------------------------------
  // 超级武器：和玩家一样需要手动瞄准，但由 AI 自己选目标
  // ---------------------------------------------------------------------
  function useSuperweapons(state, p, base) {
    var list = Sim.superList(state, p.index);
    var ready = null;
    for (var i = 0; i < list.length; i++) if (list[i].ready) { ready = list[i]; break; }
    if (!ready) return;

    if (ready.key === 'nuke' || ready.key === 'weather') {
      var target = pickSuperTarget(state, p, base);
      if (target) Sim.fireSuper(state, p.index, ready.key, target.cx, target.cy);
      return;
    }
    if (ready.key === 'ironcurtain') {
      var cluster = biggestOwnCluster(state, p, 3.0, null);
      if (cluster && cluster.count >= 4) Sim.fireSuper(state, p.index, ready.key, cluster.x, cluster.y);
      return;
    }
    if (ready.key === 'chronosphere') {
      var army = biggestOwnCluster(state, p, 3.0, function (u) {
        return !!Sim.primaryWeapon(u) && !u.def.flying;
      });
      if (!army || army.count < 4) return;
      var dst = pickSuperTarget(state, p, base);
      if (dst) Sim.fireSuper(state, p.index, ready.key, army.x, army.y, dst.cx, dst.cy);
    }
  }

  /** 选一个建筑最密集 / 最值钱的目标（核弹、天气、超时空偷袭用）。 */
  function pickSuperTarget(state, p, base) {
    var best = null, bestScore = -1e9;
    for (var i = 0; i < state.buildings.length; i++) {
      var b = state.buildings[i];
      if (b.dead || b.owner === p.index) continue;
      if (!Sim.isEntityKnown(state, p.index, b)) continue;
      var cluster = 0;
      for (var k = 0; k < state.buildings.length; k++) {
        var o = state.buildings[k];
        if (o.dead || o.owner !== b.owner) continue;
        if (U.dist(o.cx, o.cy, b.cx, b.cy) < 3.2) cluster++;
      }
      var score = cluster * 7 - U.dist(b.cx, b.cy, base.x, base.y) * 0.08;
      if (b.type === 'conyard') score += 10;
      if (b.type === 'refinery') score += 6;
      if (b.type === 'warfactory') score += 4;
      if (score > bestScore) { bestScore = score; best = b; }
    }
    return best;
  }

  /** 我方最密集的一堆单位（铁幕、超时空起跳点用）。 */
  function biggestOwnCluster(state, p, radius, filter) {
    var own = [];
    for (var i = 0; i < state.units.length; i++) {
      var u = state.units[i];
      if (u.dead || u.owner !== p.index) continue;
      if (filter && !filter(u)) continue;
      own.push(u);
    }
    var best = null, bestCount = 0;
    for (i = 0; i < own.length; i++) {
      var count = 1;
      for (var k = 0; k < own.length; k++) {
        if (k === i) continue;
        if (U.dist(own[i].x, own[i].y, own[k].x, own[k].y) <= radius) count++;
      }
      if (count > bestCount) { bestCount = count; best = { x: own[i].x, y: own[i].y, count: count }; }
    }
    return best;
  }

  /** 间谍：自己找敌方精炼厂 / 电厂下手。 */
  function useSpies(state, p, units) {
    for (var i = 0; i < units.length; i++) {
      var sp = units[i];
      if (sp.type !== 'spy') continue;
      if (sp.order && (sp.order.type === 'infiltrate' ||
        (sp.order.type === 'attack' && sp.order.targetId))) continue;
      var best = null, bestScore = -1e9;
      for (var k = 0; k < state.buildings.length; k++) {
        var b = state.buildings[k];
        if (b.dead || b.owner === p.index) continue;
        if (!Sim.isEntityKnown(state, p.index, b)) continue;
        var tags = b.def.tags || [];
        var score = 40 - U.dist(b.cx, b.cy, sp.x, sp.y) * 0.2;
        if (tags.indexOf('refinery') >= 0) score += 20;
        if (tags.indexOf('power') >= 0) score += 14;
        if (score > bestScore) { bestScore = score; best = b; }
      }
      if (best) Sim.issueOrder(state, p.index, [sp.id], { type: 'attack', targetId: best.id });
    }
  }

  // ---------------------------------------------------------------------
  function think(state, p) {
    var units = ownUnits(state, p.index);
    var buildings = [];
    for (var i = 0; i < state.buildings.length; i++) {
      var b = state.buildings[i];
      if (!b.dead && b.owner === p.index) buildings.push(b);
    }
    var base = baseCenter(state, p, units, buildings);
    p.ai.baseX = base.x; p.ai.baseY = base.y;

    handleReadyStructures(state, p, base);
    decideConstruction(state, p, buildings, units, base);
    decideProduction(state, p, buildings, units, base);
    decideMilitary(state, p, units, base);
    useSpies(state, p, units);
    useSuperweapons(state, p, base);

    // Expansion: if the local ore is gone, open a second mining operation.
    if (state.tick - p.ai.lastExpandTick > 30 * Rules.TICKS_PER_SEC) {
      p.ai.lastExpandTick = state.tick;
      var miners = 0, idleMiners = 0;
      for (i = 0; i < units.length; i++) {
        if (!units[i].def.capacity) continue;
        miners++;
        if (units[i].state === 'idle') idleMiners++;
      }
      var near = nearestRichOre(state, base);
      if (miners > 0 && idleMiners >= Math.ceil(miners / 2)) {
        if (p.credits > 3000 && !hasReadyOrQueued(state, p, 'refinery')) queue(state, p, 'refinery');
      } else if (near && U.dist(near.x, near.y, base.x, base.y) > 22 && p.credits > 4000 && !hasReadyOrQueued(state, p, 'refinery')) {
        queue(state, p, 'refinery');
      }
    }
  }

  AI.createBrain = createBrain;
  AI.tryPlace = tryPlace;
  RA.AI = AI;
})(globalThis.RA = globalThis.RA || {});

</script>
<script>
/* src/render/art.js */
/*
 * Red Alert Web - procedural art.
 *
 * Every sprite in the game is drawn with code: isometric boxes, tapered
 * towers and small figures, pre-rendered once into off-screen canvases and
 * then blitted.  No external image files are used anywhere in the project.
 */
(function (RA) {
  'use strict';

  var U = RA.Util;
  var Rules = RA.Rules;

  var Art = RA.Art = {};

  Art.TILE_W = 64;
  Art.TILE_H = 32;
  var TW = Art.TILE_W, TH = Art.TILE_H;

  var doc = null;
  var cache = { units: {}, buildings: {}, tiles: {}, ore: {}, objects: {}, icons: {}, flags: {} };

  Art.init = function (documentRef) {
    doc = documentRef;
    cache = { units: {}, buildings: {}, tiles: {}, ore: {}, objects: {}, icons: {}, flags: {} };
  };

  Art.canvas = function (w, h) {
    var c = doc.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w));
    c.height = Math.max(1, Math.ceil(h));
    return c;
  };

  function ctxOf(c) {
    var g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    return g;
  }

  // ---------------------------------------------------------------------
  // Projection helpers
  // ---------------------------------------------------------------------
  /** tile-space offset (dx,dy) + height (px) -> screen offset (px). */
  function projX(dx, dy) { return (dx - dy) * (TW / 2); }
  function projY(dx, dy, z) { return (dx + dy) * (TH / 2) - (z || 0); }
  Art.projX = projX;
  Art.projY = projY;

  function shade(hex, factor) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = U.clamp(Math.round(r * factor), 0, 255);
    g = U.clamp(Math.round(g * factor), 0, 255);
    b = U.clamp(Math.round(b * factor), 0, 255);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  Art.shade = shade;

  function mix(a, b, t) {
    var na = parseInt(a.slice(1), 16), nb = parseInt(b.slice(1), 16);
    var r = Math.round(U.lerp((na >> 16) & 255, (nb >> 16) & 255, t));
    var g = Math.round(U.lerp((na >> 8) & 255, (nb >> 8) & 255, t));
    var bl = Math.round(U.lerp(na & 255, nb & 255, t));
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }
  Art.mix = mix;

  /**
   * Draw an axis-aligned-then-rotated 3D box in isometric space.
   * (cx,cy) is the ground centre in tile space, angle rotates the box about
   * the vertical axis, sizes are in tiles (len/wid) and pixels (h).
   */
  function isoBox(ctx, cx, cy, len, wid, h, angle, colors, opts) {
    opts = opts || {};
    var ca = Math.cos(angle || 0), sa = Math.sin(angle || 0);
    var uv = [[-len / 2, -wid / 2], [len / 2, -wid / 2], [len / 2, wid / 2], [-len / 2, wid / 2]];
    var ground = uv.map(function (p) {
      var u = p[0], v = p[1];
      return { x: cx + u * ca - v * sa, y: cy + u * sa + v * ca };
    });
    var faces = [];
    for (var i = 0; i < 4; i++) {
      var a = ground[i], b = ground[(i + 1) % 4];
      var ex = b.x - a.x, ey = b.y - a.y;
      // outward normal in tile space
      var nx = ey, ny = -ex;
      var nl = Math.sqrt(nx * nx + ny * ny) || 1;
      nx /= nl; ny /= nl;
      var toCenterX = cx - (a.x + b.x) / 2, toCenterY = cy - (a.y + b.y) / 2;
      if (nx * toCenterX + ny * toCenterY > 0) { nx = -nx; ny = -ny; }
      var lit = U.clamp((-(nx + ny)) / Math.SQRT2, -1, 1);
      faces.push({
        a: a, b: b,
        depth: (a.x + a.y + b.x + b.y) / 2,
        bright: 0.58 + 0.42 * U.clamp((lit + 1) / 2, 0, 1)
      });
    }
    faces.sort(function (p, q) { return p.depth - q.depth; });
    for (i = 0; i < faces.length; i++) {
      var f = faces[i];
      ctx.beginPath();
      ctx.moveTo(projX(f.a.x, f.a.y), projY(f.a.x, f.a.y, 0));
      ctx.lineTo(projX(f.b.x, f.b.y), projY(f.b.x, f.b.y, 0));
      ctx.lineTo(projX(f.b.x, f.b.y), projY(f.b.x, f.b.y, h));
      ctx.lineTo(projX(f.a.x, f.a.y), projY(f.a.x, f.a.y, h));
      ctx.closePath();
      ctx.fillStyle = shade(colors.base, f.bright);
      ctx.fill();
      if (opts.stroke !== false) {
        ctx.strokeStyle = shade(colors.dark, 0.85);
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
    // top face
    ctx.beginPath();
    for (i = 0; i < 4; i++) {
      var p = ground[i];
      var px = projX(p.x, p.y), py = projY(p.x, p.y, h);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = shade(colors.base, opts.topBright || 1.06);
    ctx.fill();
    if (opts.stroke !== false) {
      ctx.strokeStyle = shade(colors.dark, 0.9);
      ctx.stroke();
    }
    return { ground: ground, top: h };
  }
  Art.isoBox = isoBox;

  /** A tapered box (tower): different top and bottom footprint sizes. */
  function isoFrustum(ctx, cx, cy, lenB, widB, lenT, widT, h, angle, colors) {
    var ca = Math.cos(angle || 0), sa = Math.sin(angle || 0);
    function corners(len, wid, z) {
      return [[-len / 2, -wid / 2], [len / 2, -wid / 2], [len / 2, wid / 2], [-len / 2, wid / 2]].map(function (p) {
        var x = cx + p[0] * ca - p[1] * sa;
        var y = cy + p[0] * sa + p[1] * ca;
        return { x: x, y: y, z: z };
      });
    }
    var bottom = corners(lenB, widB, 0);
    var top = corners(lenT, widT, h);
    var faces = [];
    for (var i = 0; i < 4; i++) {
      var a = bottom[i], b = bottom[(i + 1) % 4];
      var ex = b.x - a.x, ey = b.y - a.y;
      var nx = ey, ny = -ex;
      var nl = Math.sqrt(nx * nx + ny * ny) || 1;
      nx /= nl; ny /= nl;
      if (nx * (cx - (a.x + b.x) / 2) + ny * (cy - (a.y + b.y) / 2) > 0) { nx = -nx; ny = -ny; }
      var lit = U.clamp((-(nx + ny)) / Math.SQRT2, -1, 1);
      faces.push({ i: i, depth: (a.x + a.y + b.x + b.y) / 2, bright: 0.55 + 0.45 * U.clamp((lit + 1) / 2, 0, 1) });
    }
    faces.sort(function (p, q) { return p.depth - q.depth; });
    faces.forEach(function (f) {
      var i = f.i;
      var a = bottom[i], b = bottom[(i + 1) % 4], c = top[(i + 1) % 4], d = top[i];
      ctx.beginPath();
      ctx.moveTo(projX(a.x, a.y), projY(a.x, a.y, a.z));
      ctx.lineTo(projX(b.x, b.y), projY(b.x, b.y, b.z));
      ctx.lineTo(projX(c.x, c.y), projY(c.x, c.y, c.z));
      ctx.lineTo(projX(d.x, d.y), projY(d.x, d.y, d.z));
      ctx.closePath();
      ctx.fillStyle = shade(colors.base, f.bright);
      ctx.fill();
      ctx.strokeStyle = shade(colors.dark, 0.8);
      ctx.lineWidth = 1;
      ctx.stroke();
    });
    ctx.beginPath();
    for (i = 0; i < 4; i++) {
      var p = top[i];
      var px = projX(p.x, p.y), py = projY(p.x, p.y, p.z);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = shade(colors.base, 1.08);
    ctx.fill();
    ctx.strokeStyle = shade(colors.dark, 0.8);
    ctx.stroke();
  }
  Art.isoFrustum = isoFrustum;

  /** Small details that live on the top face of a box (in tile space). */
  function topFace(ctx, cx, cy, len, wid, h, angle, drawFn) {
    var ca = Math.cos(angle || 0), sa = Math.sin(angle || 0);
    ctx.save();
    var o = { x: projX(cx, cy), y: projY(cx, cy, h) };
    ctx.translate(o.x, o.y);
    // iso basis vectors for the rotated box
    var ux = projX(ca, sa), uy = projY(ca, sa, 0);
    var vx = projX(-sa, ca), vy = projY(-sa, ca, 0);
    ctx.transform(ux, uy, vx, vy, 0, 0);
    drawFn(ctx, len, wid);
    ctx.restore();
  }
  Art.topFace = topFace;

  /** Flat iso quad on the ground (shadows, scorch marks, ...). */
  function groundQuad(ctx, cx, cy, len, wid, angle, style) {
    var ca = Math.cos(angle || 0), sa = Math.sin(angle || 0);
    var uv = [[-len / 2, -wid / 2], [len / 2, -wid / 2], [len / 2, wid / 2], [-len / 2, wid / 2]];
    ctx.beginPath();
    for (var i = 0; i < 4; i++) {
      var x = cx + uv[i][0] * ca - uv[i][1] * sa;
      var y = cy + uv[i][0] * sa + uv[i][1] * ca;
      var px = projX(x, y), py = projY(x, y, 0);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = style;
    ctx.fill();
  }
  Art.groundQuad = groundQuad;

  // ---------------------------------------------------------------------
  // Terrain
  // ---------------------------------------------------------------------
  var TERRAIN_BASE = {
    1: ['#4a7a3c', '#43703a', '#518243', '#3f6b36'],   // grass
    2: ['#6b7346', '#626a41', '#727a4c', '#5d6540'],   // rough
    3: ['#b8a674', '#ad9c6d', '#c2b07e', '#a2926a'],   // sand
    0: ['#2a5a86', '#255078', '#31648f', '#20476c'],   // water
    4: ['#4a7a3c', '#43703a', '#518243', '#3f6b36'],
    5: ['#4a7a3c', '#43703a', '#518243', '#3f6b36']
  };

  function diamondPath(ctx, w, h, ox, oy) {
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(ox + w / 2, oy + h / 2);
    ctx.lineTo(ox, oy + h);
    ctx.lineTo(ox - w / 2, oy + h / 2);
    ctx.closePath();
  }

  function tileSprite(terrain, variant) {
    var c = Art.canvas(TW + 2, TH + 2);
    var g = ctxOf(c);
    var colors = TERRAIN_BASE[terrain] || TERRAIN_BASE[1];
    // Drawn 2px oversized so neighbouring tiles overlap and leave no seams.
    diamondPath(g, TW + 2, TH + 2, TW / 2 + 1, 0);
    g.fillStyle = colors[variant % colors.length];
    g.fill();
    if (terrain === 1 || terrain === 2 || terrain === 3) {
      // a few deterministic speckles so the ground is not flat colour
      var seed = (variant * 37 + terrain * 91) % 97;
      for (var i = 0; i < 3; i++) {
        var t = (seed + i * 29) % 100 / 100;
        var px = 1 + TW * (0.22 + t * 0.56);
        var py = 1 + TH * (0.25 + ((seed + i * 13) % 50) / 100 * 0.5);
        g.fillStyle = shade(colors[variant % colors.length], i % 2 ? 0.9 : 1.1);
        g.fillRect(px, py, 3, 2);
      }
    } else if (terrain === 0) {
      g.strokeStyle = 'rgba(190,228,255,0.22)';
      g.lineWidth = 1;
      for (var k = 0; k < 3; k++) {
        var yy = 1 + TH * (0.3 + k * 0.2);
        g.beginPath();
        g.moveTo(1 + TW * 0.3, yy);
        g.lineTo(1 + TW * 0.42, yy - 1);
        g.stroke();
        g.beginPath();
        g.moveTo(1 + TW * 0.58, yy + 2);
        g.lineTo(1 + TW * 0.7, yy + 1);
        g.stroke();
      }
    }
    return c;
  }

  function oreSprite(kind, level) {
    var c = Art.canvas(TW + 2, TH + 2);
    var g = ctxOf(c);
    var base = kind === 2 ? '#e8d24a' : '#c8a63a';
    var dark = kind === 2 ? '#9d831a' : '#7d651d';
    diamondPath(g, TW + 2, TH + 2, TW / 2 + 1, 0);
    g.fillStyle = kind === 2 ? 'rgba(120,100,10,0.45)' : 'rgba(90,70,20,0.4)';
    g.fill();
    var count = 4 + level * 4;
    for (var i = 0; i < count; i++) {
      var t = (i * 53 + level * 17) % 100 / 100;
      var px = 1 + TW * (0.15 + t * 0.7);
      var py = 1 + TH * (0.2 + ((i * 31 + level * 11) % 60) / 100 * 0.6);
      var size = 2 + (i % 3) + (level > 3 ? 1 : 0);
      g.fillStyle = i % 3 === 0 ? shade(dark, 0.9) : base;
      g.fillRect(px, py, size, size - 1);
      if (size > 2) {
        g.fillStyle = 'rgba(255,255,255,0.35)';
        g.fillRect(px, py, size - 1, 1);
      }
    }
    return c;
  }

  function objectSprite(kind, variant) {
    var w = TW * 1.4, h = TH * 2.6;
    var c = Art.canvas(w, h);
    var g = ctxOf(c);
    var cx = w / 2, baseY = h - TH / 2 - 2;
    if (kind === 'tree') {
      var trunk = '#4a3524';
      g.fillStyle = trunk;
      g.fillRect(cx - 3, baseY - 20, 6, 20);
      var greens = ['#2f6b32', '#357a38', '#295e2c'];
      for (var i = 0; i < 3; i++) {
        g.fillStyle = greens[(variant + i) % 3];
        g.beginPath();
        g.moveTo(cx - 20 + i * 9, baseY - 14 - i * 2);
        g.lineTo(cx + 20 - i * 9, baseY - 14 - i * 2);
        g.lineTo(cx, baseY - 40 - i * 6);
        g.closePath();
        g.fill();
      }
      g.fillStyle = 'rgba(0,0,0,0.22)';
      groundQuad(g, 0, 0, 0, 0, 0, 'rgba(0,0,0,0)');
      g.beginPath();
      g.ellipse ? g.ellipse(cx, baseY, 16, 8, 0, 0, Math.PI * 2) : g.arc(cx, baseY, 10, 0, Math.PI * 2);
      g.fill();
    } else if (kind === 'cliff') {
      var greys = ['#8b8578', '#78736a', '#9a9486'];
      for (i = 0; i < 3; i++) {
        g.fillStyle = greys[(variant + i) % 3];
        g.beginPath();
        g.moveTo(cx - 22 + i * 4, baseY);
        g.lineTo(cx + 14 - i * 3, baseY);
        g.lineTo(cx + 6 - i * 3, baseY - 20 - i * 6);
        g.lineTo(cx - 14 + i * 3, baseY - 16 - i * 5);
        g.closePath();
        g.fill();
      }
      g.fillStyle = 'rgba(255,255,255,0.12)';
      g.fillRect(cx - 16, baseY - 26, 20, 3);
    } else {
      // rock / bush scatter
      g.fillStyle = variant % 2 ? '#6d6455' : '#3c6b34';
      g.beginPath();
      g.moveTo(cx - 8, baseY);
      g.lineTo(cx + 7, baseY - 1);
      g.lineTo(cx + 3, baseY - 9);
      g.lineTo(cx - 6, baseY - 7);
      g.closePath();
      g.fill();
      g.fillStyle = 'rgba(0,0,0,0.18)';
      g.fillRect(cx - 8, baseY - 1, 15, 2);
    }
    return c;
  }

  // ---------------------------------------------------------------------
  // Units
  // ---------------------------------------------------------------------
  var ALLIED = { base: '#8b9a7c', dark: '#333c2e', light: '#cbd7b8' };
  var SOVIET = { base: '#9b7350', dark: '#3a2818', light: '#d2ae86' };
  var METAL = { base: '#8d979b', dark: '#2f3639', light: '#c6d0d4' };
  var METAL_DARK = { base: '#5c6469', dark: '#23282b', light: '#8f989c' };

  function palette(faction, playerColor) {
    var p = faction === 'soviet' ? SOVIET : ALLIED;
    return { base: p.base, dark: p.dark, light: p.light, accent: playerColor.hex, accentDark: playerColor.dark };
  }
  Art.palette = palette;

  function drawTracks(ctx, len, wid, h, colors) {
    isoBox(ctx, 0, -wid / 2, len, wid * 0.28, h, 0, { base: colors.dark, dark: '#1c1c1c' }, { stroke: false, topBright: 1.0 });
    isoBox(ctx, 0, wid / 2, len, wid * 0.28, h, 0, { base: colors.dark, dark: '#1c1c1c' }, { stroke: false, topBright: 1.0 });
    for (var i = 0; i < 4; i++) {
      var u = -len / 2 + len * (0.14 + i * 0.24);
      var p1 = projX(u, -wid / 2), p2 = projY(u, -wid / 2, h);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(p1 - 4, p2 + 1);
      ctx.lineTo(p1 + 4, p2 + 1);
      ctx.stroke();
    }
  }

  /**
   * Tanks are split in two layers: the hull (rotates with the unit's facing,
   * cached) and the turret (rotates independently, drawn every frame).
   */
  function chassisSpec(type) {
    switch (type) {
      case 'grizzly': return { len: 1.05, wid: 0.86, hull: 13, turretLen: 0.5, turretWid: 0.46, barrel: 0.5, barrels: 1 };
      case 'rhino': return { len: 1.18, wid: 0.94, hull: 16, turretLen: 0.6, turretWid: 0.56, barrel: 0.56, barrels: 1 };
      case 'apoc': return { len: 1.4, wid: 1.05, hull: 19, turretLen: 0.72, turretWid: 0.68, barrel: 0.6, barrels: 2, missiles: true };
      case 'prismtank': return { len: 1.1, wid: 0.86, hull: 13, turretLen: 0.44, turretWid: 0.54, barrel: 0.18, barrels: 1, prism: true };
      case 'ifv': return { len: 0.92, wid: 0.72, hull: 9, turretLen: 0.34, turretWid: 0.34, barrel: 0.14, barrels: 1, missiles: true };
      case 'mirage': return { len: 1.05, wid: 0.84, hull: 12, turretLen: 0.5, turretWid: 0.46, barrel: 0.22, barrels: 1, prism: true };
      case 'v3': return { len: 1.25, wid: 0.82, hull: 10, turretLen: 0.9, turretWid: 0.34, barrel: 0.1, barrels: 1, srocket: true };
      default: return null;
    }
  }

  function drawTankHull(ctx, s, colors, facing) {
    drawTracks(ctx, s.len, s.wid, s.hull * 0.55, colors);
    isoBox(ctx, 0, 0, s.len, s.wid * 0.86, s.hull, facing, colors, { topBright: 1.12 });
    isoBox(ctx, s.len * 0.42, 0, s.len * 0.16, s.wid * 0.8, s.hull * 0.75, facing,
      { base: colors.light || colors.base, dark: colors.dark }, { topBright: 0.98 });
  }

  function drawTankTurret(ctx, s, colors, angle) {
    var h = s.hull * 0.55;
    isoBox(ctx, 0, 0, s.turretLen, s.turretWid, h, angle, { base: colors.base, dark: colors.dark }, { topBright: 1.18 });
    for (var b = 0; b < s.barrels; b++) {
      var off = (s.barrels === 1) ? 0 : (b === 0 ? -0.09 : 0.09);
      var bx = Math.cos(angle) * (s.turretLen * 0.62 + s.barrel * 0.5) - Math.sin(angle) * off;
      var by = Math.sin(angle) * (s.turretLen * 0.62 + s.barrel * 0.5) + Math.cos(angle) * off;
      isoBox(ctx, bx, by, s.barrel, 0.11, h * 1.2, angle,
        { base: colors.dark, dark: '#20211f' }, { stroke: false, topBright: 1.1 });
    }
    if (s.prism) {
      var px = projX(0, 0), py = projY(0, 0, h);
      ctx.fillStyle = 'rgba(150,220,255,0.85)';
      ctx.beginPath();
      ctx.moveTo(px, py - 13);
      ctx.lineTo(px + 7, py - 5);
      ctx.lineTo(px, py + 2);
      ctx.lineTo(px - 7, py - 5);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(230,250,255,0.9)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    if (s.missiles) {
      for (var m = 0; m < 2; m++) {
        isoBox(ctx, -s.turretLen * 0.05, m ? 0.16 : -0.16, 0.34, 0.14, h * 1.7, angle,
          { base: colors.dark, dark: '#151515' }, { topBright: 0.9 });
      }
    }
    if (s.srocket) {
      // V3 发射架上的大火箭（占位造型）
      isoBox(ctx, 0.15, 0, 1.15, 0.26, h * 2.0, angle,
        { base: '#8e2f24', dark: '#3a1410' }, { topBright: 1.05 });
      endOfTurret(ctx, angle, s, colors, h);
    }
    topFace(ctx, 0, 0, s.turretLen, s.turretWid, h + 1, angle, function (g) {
      g.fillStyle = colors.accent;
      g.fillRect(-0.12, -0.06, 0.24, 0.12);
    });
  }

  /** 在炮塔尖端画一个小细节（V3 的弹头）。 */
  function endOfTurret(ctx, angle, s, colors, h) {
    var px = Math.cos(angle) * 0.85, py = Math.sin(angle) * 0.85;
    var gx = projX(px, py), gy = projY(px, py, h * 2.0);
    ctx.fillStyle = '#d8d24a';
    ctx.beginPath();
    ctx.moveTo(gx, gy - 6);
    ctx.lineTo(gx + 4, gy);
    ctx.lineTo(gx - 4, gy);
    ctx.closePath();
    ctx.fill();
    void colors;
  }

  /** 小型防空履带车（苏军防空履带车 / 盟军 IFV 通用造型）。 */
  function drawTrackedCar(ctx, colors, opts) {
    opts = opts || {};
    var len = opts.len || 0.95, wid = opts.wid || 0.72, hull = opts.hull || 8;
    drawTracks(ctx, len, wid, hull * 0.5, colors);
    isoBox(ctx, 0, 0, len, wid * 0.82, hull, 0, colors, { topBright: 1.1 });
    isoBox(ctx, -len * 0.15, 0, len * 0.42, wid * 0.62, hull * 0.7, 0,
      { base: colors.dark, dark: '#1d1d1d' }, { topBright: 1.0 });
    if (opts.flak) {
      for (var i = 0; i < 4; i++) {
        var off = (i - 1.5) * 0.11;
        isoBox(ctx, len * 0.22, off, 0.44, 0.08, hull * 1.5, 0,
          { base: '#3a3a3a', dark: '#141414' }, { stroke: false, topBright: 1.05 });
      }
    }
  }

  function drawHarvester(ctx, colors) {
    drawTracks(ctx, 1.3, 0.95, 6, colors);
    isoBox(ctx, 0, 0, 1.3, 0.82, 11, 0, colors);
    isoBox(ctx, 0.5, 0, 0.4, 0.8, 9, 0, { base: colors.dark, dark: '#1b1b1b' });
    isoBox(ctx, -0.25, 0, 0.62, 0.7, 5, 0, { base: '#3a3a3a', dark: '#191919' }, { topBright: 1.2 });
    topFace(ctx, -0.25, 0, 0.62, 0.7, 16, 0, function (gg) {
      gg.fillStyle = '#c8a63a';
      gg.fillRect(-0.28, -0.32, 0.56, 0.64);
      gg.fillStyle = '#e8d24a';
      gg.fillRect(-0.22, -0.26, 0.44, 0.52);
    });
    var px = projX(0.72, 0), py = projY(0.72, 0, 2);
    ctx.fillStyle = colors.light || colors.base;
    ctx.beginPath();
    ctx.moveTo(px - 8, py - 4);
    ctx.lineTo(px + 10, py + 3);
    ctx.lineTo(px + 8, py + 9);
    ctx.lineTo(px - 8, py + 5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = shade(colors.dark, 0.9);
    ctx.lineWidth = 1;
    ctx.stroke();
    isoBox(ctx, -0.5, 0, 0.3, 0.72, 6, 0, { base: colors.dark, dark: '#181818' }, { topBright: 1.05 });
  }

  function unitDrawer(type, colors, angle) {
    switch (type) {
      case 'grizzly':
      case 'rhino':
      case 'apoc':
      case 'prismtank':
        return function (g) {
          drawTankHull(g, chassisSpec(type), colors, angle);
        };
      case 'harvester':
        return function (g) { drawHarvester(g, colors); };
      case 'gi':
      case 'conscript':
      case 'guardian':
      case 'flak':
      case 'engineer':
      case 'tesla_trooper':
      case 'spy':
        return function (g) { drawInfantry(g, type, colors, angle); };
      case 'rocketeer':
        return function (g) { drawRocketeer(g, colors, angle); };
      case 'ifv':
        return function (g) { drawTankHull(g, chassisSpec('ifv'), colors, angle); };
      case 'mirage':
        return function (g) { drawTankHull(g, chassisSpec('mirage'), colors, angle); };
      case 'v3':
        return function (g) { drawTankHull(g, chassisSpec('v3'), colors, angle); };
      case 'warminer':
        return function (g) { drawHarvester(g, colors); drawMinerGun(g); };
      case 'flaktrack':
        return function (g) {
          drawTrackedCar(g, colors, { flak: true, len: 0.95, wid: 0.74, hull: 8 });
        };
      default:
        return function (g) {
          isoBox(g, 0, 0, 0.9, 0.8, 10, angle, colors);
        };
    }
  }

  function drawInfantry(g, type, colors, angle) {
    var body = type === 'engineer' ? '#d8d2c0'
      : (type === 'conscript' ? '#7a5a44'
        : (type === 'guardian' ? '#5d6b5a'
          : (type === 'tesla_trooper' ? '#6c7a86'
            : (type === 'spy' ? '#3c4048' : '#66745f'))));
    var helmet = type === 'conscript' ? '#5d4a3a'
      : (type === 'tesla_trooper' ? '#9fb6c4' : (type === 'spy' ? '#2b2f36' : '#4a5a4a'));
    var swing = Math.sin(angle * 3) * 0.6;
    // shadow
    g.fillStyle = 'rgba(0,0,0,0.28)';
    g.beginPath();
    g.moveTo(-7, 2);
    g.lineTo(3, -2);
    g.lineTo(7, 2);
    g.lineTo(-3, 6);
    g.closePath();
    g.fill();
    // legs
    g.fillStyle = shade(body, 0.72);
    var legX = Math.cos(angle) * 2, legY = Math.sin(angle) * 1.2;
    g.fillRect(-4 + legX, -8 + legY, 3, 9);
    g.fillRect(1 - legX, -8 - legY, 3, 9);
    // torso
    g.fillStyle = body;
    g.fillRect(-5, -17, 9, 10);
    g.strokeStyle = shade(colors.dark, 0.9);
    g.lineWidth = 1;
    g.strokeRect(-5, -17, 9, 10);
    // head + helmet
    g.fillStyle = '#d7b291';
    g.beginPath();
    g.arc(0, -21, 4, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = helmet;
    g.beginPath();
    g.arc(0, -22, 4.4, Math.PI, Math.PI * 2);
    g.fill();
    // weapon pointing at `angle`
    var wx = Math.cos(angle) * 9, wy = Math.sin(angle) * 12;
    g.strokeStyle = '#2b2b2b';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(0, -13);
    g.lineTo(wx, -13 + wy * 0.5);
    g.stroke();
    if (type === 'guardian') {
      g.strokeStyle = '#4a4a4a';
      g.lineWidth = 4;
      g.beginPath();
      g.moveTo(wx * 0.7, -17 + wy * 0.4);
      g.lineTo(wx * 1.2, -17 + wy * 0.6);
      g.stroke();
    }
    if (type === 'flak') {
      g.fillStyle = '#3d3d3d';
      g.fillRect(wx - 2, -16 + wy * 0.5, 5, 6);
    }
    if (type === 'tesla_trooper') {
      // 背后的磁暴线圈背包
      g.fillStyle = '#2f3a44';
      g.fillRect(-9, -19, 4, 11);
      for (var ci = 0; ci < 3; ci++) {
        g.strokeStyle = 'rgba(150,220,255,0.9)';
        g.lineWidth = 1;

  function unitSpriteCanvas(type, playerColor, facingIdx, steps) {
    var def = Rules.units[type];
    var faction = def.faction === 'any' ? 'allied' : def.faction;
    var colors = palette(faction, playerColor);
    var size = 96;
    var c = Art.canvas(size, size);
    var g = ctxOf(c);
    g.save();
    g.translate(size / 2, size / 2 + 10);
    var angle = (facingIdx / steps) * Math.PI * 2;
    var drawer = unitDrawer(type, colors, angle);
    drawer(g);
    g.restore();
    return c;
  }

  var UNIT_CANVAS = 96;
  var UNIT_ORIGIN_X = UNIT_CANVAS / 2;
  var UNIT_ORIGIN_Y = UNIT_CANVAS / 2 + 10;

  /**
   * Draw a complete unit (hull + turret) at screen position (sx,sy), which is
   * the unit's ground point.
   */
  Art.drawUnit = function (ctx, type, colorId, sx, sy, facing, turret) {
    var def = Rules.units[type];
    var spr = Art.unitSprite(type, colorId, facing);
    ctx.drawImage(spr, Math.round(sx - UNIT_ORIGIN_X), Math.round(sy - UNIT_ORIGIN_Y));
    if (!def || !def.turret) return;
    var s = chassisSpec(type);
    if (!s) return;
    var faction = def.faction === 'any' ? 'allied' : def.faction;
    var colors = palette(faction, Rules.PLAYER_COLORS[colorId]);
    ctx.save();
    ctx.translate(sx, sy);
    drawTankTurret(ctx, s, colors, turret === undefined ? facing : turret);
    ctx.restore();
  };

  Art.unitCanvasMeta = function () {
    return { size: UNIT_CANVAS, ox: UNIT_ORIGIN_X, oy: UNIT_ORIGIN_Y };
  };

    g.strokeStyle = 'rgba(180,255,240,0.85)';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(p1, y);
    g.lineTo(p2, y);
    g.stroke();
    for (var i = 0; i < 5; i++) {
      g.strokeStyle = 'rgba(140,240,220,' + (0.25 + i * 0.1) + ')';
      g.beginPath();
      g.moveTo(p1, y + 3 + i * 3);
      g.lineTo(p2, y + 3 + i * 3);
      g.stroke();
    }
    topFace(g, 0, 0, 2, 2, 9, 0, function (gg) {
      gg.fillStyle = 'rgba(34,42,48,0.9)';
      gg.fillRect(-0.85, -0.85, 1.7, 1.7);
      gg.fillStyle = colors.accent;
      gg.fillRect(-0.85, 0.45, 1.7, 0.3);
    });
  }

  function drawNuke(g, colors) {
    isoBox(g, 0, 0, 2, 2, 8, 0, colors);
    isoFrustum(g, 0, 0, 1.5, 1.5, 1.3, 1.3, 12, 0, { base: '#9aa4a8', dark: '#333b3f' });
    var px = projX(0, 0), py = projY(0, 0, 20);
    g.fillStyle = '#c8342a';
    g.beginPath();
    g.ellipse ? g.ellipse(px, py, 13, 7, 0, 0, Math.PI * 2) : g.arc(px, py, 10, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = '#e8d24a';
    g.beginPath();
    g.ellipse ? g.ellipse(px, py, 5, 3, 0, 0, Math.PI * 2) : g.arc(px, py, 4, 0, Math.PI * 2);
    g.fill();
    topFace(g, 0, 0, 2, 2, 8, 0, function (gg) {
      gg.fillStyle = 'rgba(36,44,48,0.9)';
      gg.fillRect(-0.85, -0.85, 1.7, 1.7);
      gg.fillStyle = colors.accent;
      gg.fillRect(-0.85, -0.85, 1.7, 0.3);
    });
  }

  function drawPurifier(g, colors) {
    isoBox(g, 0, 0, 2, 2, 13, 0, colors);
    isoFrustum(g, 0.45, 0.45, 0.8, 0.8, 0.6, 0.6, 18, 0, METAL);
    var px = projX(0.45, 0.45), py = projY(0.45, 0.45, 18);
    g.fillStyle = '#d8b24a';
    g.beginPath();
    g.ellipse ? g.ellipse(px, py, 9, 5, 0, 0, Math.PI * 2) : g.arc(px, py, 7, 0, Math.PI * 2);
    g.fill();
    isoBox(g, -0.5, -0.4, 0.5, 0.5, 6, 0, METAL_DARK, { topBright: 1.05 });
    topFace(g, 0, 0, 2, 2, 13, 0, function (gg) {
      gg.fillStyle = 'rgba(38,46,50,0.9)';
      gg.fillRect(-0.85, -0.85, 1.7, 1.7);
      gg.fillStyle = '#c8a63a';
      gg.fillRect(-0.7, -0.7, 0.7, 0.7);
      gg.fillStyle = colors.accent;
      gg.fillRect(-0.85, 0.5, 1.7, 0.3);
    });
  }

  function drawDepot(g, colors) {
    // 平整的维修台 + 吊臂
    groundQuad(g, 0, 0, 3.1, 2.1, 0, 'rgba(60,70,76,0.85)');
    isoBox(g, -0.9, 0, 1.1, 1.9, 7, 0, { base: '#6f7a80', dark: '#2b3236' });
    var px = projX(-0.9, -0.7), py = projY(-0.9, -0.7, 14);
    g.strokeStyle = '#d8c05a';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(px, py);
    g.lineTo(px + 26, py - 10);
    g.stroke();
    g.strokeStyle = '#5a4a12';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(px + 22, py - 8);
    g.lineTo(px + 22, py + 4);
    g.stroke();
    topFace(g, -0.9, 0, 1.1, 1.9, 7, 0, function (gg) {
      gg.fillStyle = 'rgba(36,44,48,0.9)';
      gg.fillRect(-0.45, -0.85, 0.9, 1.7);
      gg.fillStyle = colors.accent;
      gg.fillRect(-0.45, -0.85, 0.9, 0.3);
    });
  }

  var BUILDING_DRAWERS = {
    conyard: drawConyard,
    allied_power: function (g, c) { drawPowerPlant(g, c, false); },
    soviet_power: function (g, c) { drawPowerPlant(g, c, true); },
    refinery: drawRefinery,
    barracks: function (g, c) { drawBarracks(g, c, false); },
    warfactory: drawWarFactory,
    lab: drawLab,
    allied_pillbox: drawPillbox,
    allied_patriot: drawPatriot,
    allied_prism: drawPrismTower,
    soviet_sentry: drawSentry,
    soviet_flak: drawFlakCannon,
    soviet_tesla: drawTeslaCoil,
    // 原版向新增建筑（占位造型）
    allied_adv_power: function (g, c) { drawPowerPlant(g, c, false); },
    allied_radar: drawRadar,
    soviet_radar: drawRadar,
    allied_satellite: drawRadar,
    allied_gap: drawGap,
    allied_chronosphere: drawChronosphere,
    allied_weather: drawWeather,
    soviet_nuclear: drawNuclear,
    soviet_ironcurtain: drawIronCurtain,
    soviet_nuke: drawNuke,
    ore_purifier: drawPurifier,
    service_depot: drawDepot,
    // 短名（def.art）也注册一份，任何调用方式都能找到
    radar: drawRadar,
    gap: drawGap,
    chronosphere: drawChronosphere,
    weather: drawWeather,
    nuclear: drawNuclear,
    ironcurtain: drawIronCurtain,
    nuke: drawNuke,
    purifier: drawPurifier,
    depot: drawDepot
  };

  Art.buildingSize = function (type) {
    var def = Rules.buildings[type];
    var w = (def.w + def.h) * (TW / 2) + 40;
    var h = (def.w + def.h) * (TH / 2) + 70;
    return { w: w, h: h, ox: w / 2, oy: h - (def.h * TH / 2) - 12 };
  };

  function buildingSpriteCanvas(type, playerColor) {
    var def = Rules.buildings[type];
    var faction = def.faction === 'any' ? (type.indexOf('soviet') === 0 ? 'soviet' : 'allied') : def.faction;
    var colors = palette(faction, playerColor);
    var size = Art.buildingSize(type);
    var c = Art.canvas(size.w, size.h);
    var g = ctxOf(c);
    g.save();
    g.translate(size.ox, size.oy);
    // ground shadow
    groundQuad(g, 0, 0, def.w * 1.06, def.h * 1.06, 0, 'rgba(0,0,0,0.22)');
    // 按完整 id 查找；找不到就用 def.art 兜底（避免加新建筑时漏画）
    var drawer = BUILDING_DRAWERS[type] || (def.art ? BUILDING_DRAWERS[def.art] : null);
    if (drawer) drawer(g, colors, def);
    g.restore();
    return c;
  }

  // ---------------------------------------------------------------------
  // Cache accessors
  // ---------------------------------------------------------------------
  var FACINGS = 16;

  Art.unitSprite = function (type, colorId, facing) {
    var idx = Math.round(U.normalizeAngle(facing || 0) / (Math.PI * 2) * FACINGS) % FACINGS;
    var key = type + '|' + colorId + '|' + idx;
    if (!cache.units[key]) cache.units[key] = unitSpriteCanvas(type, Rules.PLAYER_COLORS[colorId], idx, FACINGS);
    return cache.units[key];
  };

  Art.buildingSprite = function (type, colorId) {
    var key = type + '|' + colorId;
    if (!cache.buildings[key]) cache.buildings[key] = buildingSpriteCanvas(type, Rules.PLAYER_COLORS[colorId]);
    return cache.buildings[key];
  };

  Art.tileSprite = function (terrain, variant) {
    var key = terrain + '|' + (variant % 4);
    if (!cache.tiles[key]) cache.tiles[key] = tileSprite(terrain, variant % 4);
    return cache.tiles[key];
  };

  Art.oreSprite = function (kind, level) {
    var lv = U.clamp(Math.ceil(level), 1, 6);
    var key = kind + '|' + lv;
    if (!cache.ore[key]) cache.ore[key] = oreSprite(kind, lv);
    return cache.ore[key];
  };

  Art.objectSprite = function (kind, variant) {
    var key = kind + '|' + (variant % 3);
    if (!cache.objects[key]) cache.objects[key] = objectSprite(kind, variant % 3);
    return cache.objects[key];
  };

  /**
   * Sidebar icon: the normal sprite drawn small on a dark plate, so that the
   * build bar matches what you actually see on the battlefield.
   */
  Art.iconSprite = function (type, colorId, w, h) {
    w = w || 54; h = h || 38;
    var key = type + '|' + colorId + '|' + w + 'x' + h;
    if (cache.icons[key]) return cache.icons[key];
    var c = Art.canvas(w, h);
    var g = ctxOf(c);
    var def = Rules.get(type);
    if (def.kind === 'building') {
      var src = Art.buildingSprite(type, colorId);
      var scale = Math.min((w - 4) / src.width, (h - 4) / src.height);
      var dw = src.width * scale, dh = src.height * scale;
      g.drawImage(src, 0, 0, src.width, src.height, (w - dw) / 2, (h - dh) / 2, dw, dh);
    } else {
      // draw the unit straight into the icon canvas at a fixed 3/4 view
      g.save();
      g.translate(w / 2, h - 4 - 16);
      g.scale(0.72, 0.72);
      Art.drawUnit(g, type, colorId, 0, 0, Math.PI * 0.35, Math.PI * 0.35);
      g.restore();
    }
    cache.icons[key] = c;
    return c;
  };

  Art.clearCache = function () {
    cache = { units: {}, buildings: {}, tiles: {}, ore: {}, objects: {}, icons: {}, flags: {} };
  };
})(globalThis.RA = globalThis.RA || {});
