/* src/render/iso.js */
/*
 * Isometric projection helpers shared by the renderer and the input layer.
 * Tile space (x,y) -> screen space, with the camera applied separately by the
 * canvas transform.
 */
(function (RA) {
  'use strict';

  var TW = RA.Art ? RA.Art.TILE_W : 64;
  var TH = RA.Art ? RA.Art.TILE_H : 32;

  var Iso = RA.Iso = {
    TILE_W: TW,
    TILE_H: TH
  };

  Iso.refresh = function () {
    TW = Iso.TILE_W = RA.Art.TILE_W;
    TH = Iso.TILE_H = RA.Art.TILE_H;
  };

  /** Tile-space point (floats) to iso screen pixels (camera not applied). */
  Iso.toScreen = function (x, y) {
    return { x: (x - y) * (TW / 2), y: (x + y) * (TH / 2) };
  };
  Iso.sx = function (x, y) { return (x - y) * (TW / 2); };
  Iso.sy = function (x, y) { return (x + y) * (TH / 2); };

  /** Iso screen pixels back to tile-space floats. */
  Iso.toTile = function (sx, sy) {
    var a = sx / (TW / 2);
    var b = sy / (TH / 2);
    return { x: (b + a) / 2, y: (b - a) / 2 };
  };

  /** Screen pixel (already camera-relative) to the tile under it. */
  Iso.tileAt = function (sx, sy) {
    var t = Iso.toTile(sx, sy);
    return { x: Math.floor(t.x), y: Math.floor(t.y), fx: t.x, fy: t.y };
  };

  /** Bounding box of the whole map in iso screen pixels. */
  Iso.mapBounds = function (map) {
    return {
      minX: -(map.h) * (TW / 2),
      minY: 0,
      maxX: (map.w) * (TW / 2),
      maxY: (map.w + map.h) * (TH / 2)
    };
  };
})(globalThis.RA = globalThis.RA || {});

</script>
<script>
/* src/render/renderer.js */
/*
 * Red Alert Web - battlefield renderer.
 *
 * Draws terrain, structures, units, projectiles, effects, fog of war and the
 * selection overlays on a single 2D canvas.  All art is procedural (art.js).
 */
(function (RA) {
  'use strict';

  var U = RA.Util;
  var Rules = RA.Rules;
  var Art = RA.Art;
  var Iso = RA.Iso;
  var Sim = RA.Sim;
  var T = RA.TERRAIN;

  var Renderer = RA.Renderer = {};

  Renderer.create = function (canvas) {
    var ctx = canvas.getContext('2d');
    var camera = { x: 0, y: 0, zoom: 1 };
    var viewW = canvas.width, viewH = canvas.height;
    var drawables = [];

    function screenToWorld(sx, sy) {
      return { x: sx / camera.zoom + camera.x, y: sy / camera.zoom + camera.y };
    }
    function worldToScreen(wx, wy) {
      return { x: (wx - camera.x) * camera.zoom, y: (wy - camera.y) * camera.zoom };
    }
    function tileAtScreen(sx, sy) {
      var w = screenToWorld(sx, sy);
      return Iso.tileAt(w.x, w.y);
    }

    function clampCamera(map) {
      var b = Iso.mapBounds(map);
      var minX = b.minX + viewW * 0.25 / camera.zoom;
      var maxX = b.maxX - viewW * 0.75 / camera.zoom;
      var minY = b.minY - viewH * 0.25 / camera.zoom;
      var maxY = b.maxY - viewH * 0.75 / camera.zoom;
      camera.x = U.clamp(camera.x, minX, Math.max(minX, maxX));
      camera.y = U.clamp(camera.y, minY, Math.max(minY, maxY));
    }

    function centerOn(map, tileX, tileY) {
      camera.x = Iso.sx(tileX, tileY) - viewW / (2 * camera.zoom);
      camera.y = Iso.sy(tileX, tileY) - viewH / (2 * camera.zoom);
      clampCamera(map);
    }

    function visibleRange(map) {
      var tl = tileAtScreen(0, 0);
      var tr = tileAtScreen(viewW, 0);
      var bl = tileAtScreen(0, viewH);
      var br = tileAtScreen(viewW, viewH);
      var minX = Math.floor(Math.min(tl.x, tr.x, bl.x, br.x)) - 2;
      var maxX = Math.ceil(Math.max(tl.x, tr.x, bl.x, br.x)) + 2;
      var minY = Math.floor(Math.min(tl.y, tr.y, bl.y, br.y)) - 2;
      var maxY = Math.ceil(Math.max(tl.y, tr.y, bl.y, br.y)) + 2;
      return {
        x0: U.clamp(minX, 0, map.w - 1),
        x1: U.clamp(maxX, 0, map.w - 1),
        y0: U.clamp(minY, 0, map.h - 1),
        y1: U.clamp(maxY, 0, map.h - 1)
      };
    }

    function drawTerrain(state) {
      var map = state.map;
      var r = visibleRange(map);
      for (var y = r.y0; y <= r.y1; y++) {
        for (var x = r.x0; x <= r.x1; x++) {
          var i = y * map.w + x;
          var spr = Art.tileSprite(map.terrain[i], (x * 7 + y * 13) % 4);
          var sx = Iso.sx(x, y) - Art.TILE_W / 2;
          var sy = Iso.sy(x, y);
          ctx.drawImage(spr, Math.round(sx), Math.round(sy));
          var ore = map.ore[i];
          if (ore > 0) {
            var lvl = U.clamp(Math.ceil(ore / 50), 1, 6);
            ctx.drawImage(Art.oreSprite(map.oreKind[i] || 1, lvl), Math.round(sx), Math.round(sy));
          }
        }
      }
    }

    function drawGroundDecals(state) {
      var r = visibleRange(state.map);
      for (var k = 0; k < state.decals.length; k++) {
        var d = state.decals[k];
        if (d.x < r.x0 - 2 || d.x > r.x1 + 2 || d.y < r.y0 - 2 || d.y > r.y1 + 2) continue;
        var sx = Iso.sx(d.x, d.y), sy = Iso.sy(d.x, d.y);
        if (d.type === 'scorch') {
          ctx.save();
          ctx.globalAlpha = 0.34;
          Art.groundQuad(ctx, d.x, d.y, 0.95, 0.95, 0, '#241d16');
          ctx.restore();
        } else {
          ctx.save();
          Art.groundQuad(ctx, d.x, d.y, 1.2, 1.0, d.angle || 0, 'rgba(0,0,0,0.3)');
          ctx.translate(sx, sy);
          ctx.fillStyle = '#3a352e';
          ctx.fillRect(-10, -7, 20, 12);
          ctx.fillStyle = '#26231e';
          ctx.fillRect(-7, -11, 5, 5);
          ctx.fillRect(2, -11, 5, 5);
          ctx.strokeStyle = '#1a1815';
          ctx.lineWidth = 1;
          ctx.strokeRect(-10, -7, 20, 12);
          ctx.restore();
        }
      }
    }

    function collectDrawables(state, r) {
      drawables.length = 0;
      var map = state.map;
      var i, e;
      for (var y = r.y0; y <= r.y1; y++) {
        for (var x = r.x0; x <= r.x1; x++) {
          var t = map.terrain[y * map.w + x];
          if (t === T.TREE || t === T.CLIFF) {
            drawables.push({ depth: x + y, kind: 'object', x: x, y: y, t: t, v: (x * 3 + y) % 3 });
          }
        }
      }
      for (i = 0; i < state.buildings.length; i++) {
        e = state.buildings[i];
        if (e.dead) continue;
        if (e.x + e.w < r.x0 - 3 || e.x > r.x1 + 3 || e.y + e.h < r.y0 - 3 || e.y > r.y1 + 3) continue;
        drawables.push({ depth: e.cx + e.cy + 0.001, kind: 'building', e: e });
      }
      for (i = 0; i < state.units.length; i++) {
        e = state.units[i];
        if (e.dead) continue;
        if (e.x < r.x0 - 2 || e.x > r.x1 + 2 || e.y < r.y0 - 2 || e.y > r.y1 + 2) continue;
        drawables.push({ depth: e.x + e.y, kind: 'unit', e: e });
      }
      drawables.sort(function (a, b) { return a.depth - b.depth; });
      return drawables;
    }

    function drawObject(d) {
      var spr = Art.objectSprite(d.t === T.TREE ? 'tree' : 'cliff', d.v);
      var sx = Iso.sx(d.x, d.y);
      var sy = Iso.sy(d.x, d.y);
      ctx.drawImage(spr, Math.round(sx - spr.width / 2), Math.round(sy + Art.TILE_H / 2 - spr.height + 4));
    }

    // -------------------------------------------------------------------
    // Structures and units
    // -------------------------------------------------------------------
    function drawFlag(tx, ty, color) {
      var sx = Iso.sx(tx, ty), sy = Iso.sy(tx, ty);
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = '#e8e8e8';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx, sy - 16);
      ctx.stroke();
      ctx.fillStyle = color.hex;
      ctx.beginPath();
      ctx.moveTo(sx, sy - 16);
      ctx.lineTo(sx + 9, sy - 13);
      ctx.lineTo(sx, sy - 9);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawBuilding(e, state, view) {
      var player = state.players[e.owner];
      var spr = Art.buildingSprite(e.type, player.colorId);
      var size = Art.buildingSize(e.type);
      var sx = Math.round(Iso.sx(e.cx, e.cy) - size.ox);
      var sy = Math.round(Iso.sy(e.cx, e.cy) - size.oy);

      if (view && view.selected && view.selected.has(e.id)) {
        ctx.save();
        ctx.globalAlpha = 0.8;
        Art.groundQuad(ctx, e.cx - 0.5, e.cy - 0.5, e.w + 0.3, e.h + 0.3, 0, 'rgba(80,255,120,0.35)');
        ctx.restore();
      }
      if (!e.complete) {
        var prog = 1 - U.clamp(e.buildTicks / e.buildTotal, 0, 1);
        var srcH = Math.max(2, Math.round(spr.height * prog));
        ctx.save();
        ctx.globalAlpha = 0.6 + 0.4 * prog;
        ctx.drawImage(spr, 0, spr.height - srcH, spr.width, srcH,
          sx, sy + spr.height - srcH, spr.width, srcH);
        ctx.restore();
        ctx.save();
        ctx.strokeStyle = 'rgba(210,200,150,0.75)';
        ctx.lineWidth = 1;
        for (var k = 0; k <= 3; k++) {
          var bx = sx + (spr.width / 4) * k;
          ctx.beginPath();
          ctx.moveTo(bx, sy + spr.height);
          ctx.lineTo(bx, sy + spr.height - srcH - 6);
          ctx.stroke();
        }
        ctx.restore();
      } else {
        ctx.drawImage(spr, sx, sy);
      }

      var hpFrac = U.clamp(e.hp / e.maxHp, 0, 1);
      if (hpFrac < 0.8) {
        var ticks = state.tick;
        var puffs = hpFrac < 0.4 ? 4 : 2;
        for (var p = 0; p < puffs; p++) {
          var seed = (e.id * 31 + p * 17) % 100 / 100;
          var life = ((ticks * 0.6 + p * 40 + seed * 60) % 40);
          var px = sx + spr.width * (0.3 + seed * 0.4) + Math.sin(ticks * 0.05 + p) * 3;
          var py = sy + spr.height * 0.4 - life;
          ctx.save();
          ctx.globalAlpha = Math.max(0.06, 0.4 * (1 - life / 40));
          ctx.fillStyle = '#4a4a4a';
          ctx.beginPath();
          ctx.arc(px, py, 4 + p + life * 0.05, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        if (hpFrac < 0.4) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 0.45 + 0.3 * Math.sin(ticks * 0.3 + e.id);
          ctx.fillStyle = '#ff8a2a';
          ctx.beginPath();
          ctx.arc(sx + spr.width * 0.5, sy + spr.height * 0.62, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
      if (e.flash > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = e.flash / 4 * 0.4;
        ctx.fillStyle = '#ffb060';
        ctx.beginPath();
        ctx.arc(sx + spr.width / 2, sy + spr.height * 0.65, spr.width * 0.28, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      if (e.repairing) {
        ctx.save();
        ctx.globalAlpha = 0.7 + 0.3 * Math.sin(state.tick * 0.25);
        ctx.strokeStyle = '#7cff9a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sx + spr.width / 2, sy + spr.height * 0.5, 12, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      if (view && view.playerIdx === e.owner && e.rally) drawFlag(e.rally.x, e.rally.y, player.color);
    }

    function drawUnit(e, state, view) {
      var player = state.players[e.owner];
      var sx = Iso.sx(e.x, e.y);
      var sy = Iso.sy(e.x, e.y) - (e.def.flying ? (e.def.altitude || 1.6) * Art.TILE_H * 0.55 : 0);
      var rad = (e.def.radius || 0.3) * 3.6;
      // 幻影坦克伪装：画成一棵树（原版机制）
      if (e.disguised) {
        var tree = Art.objectSprite('tree', (e.id % 3));
        if (view && view.playerIdx === e.owner && view.selected && view.selected.has(e.id)) {
          Art.groundQuad(ctx, e.x, e.y, rad, rad, 0, 'rgba(70,235,110,0.45)');
        }
        ctx.drawImage(tree, Math.round(sx - tree.width / 2),
          Math.round(sy + Art.TILE_H / 2 - tree.height + 4));
        return;
      }
      if (view && view.selected && view.selected.has(e.id)) {
        ctx.save();
        Art.groundQuad(ctx, e.x, e.y, rad, rad, 0, 'rgba(70,235,110,0.45)');
        ctx.restore();
      }
      if (view && view.hoverId === e.id) {
        ctx.save();
        Art.groundQuad(ctx, e.x, e.y, rad, rad, 0, 'rgba(255,255,255,0.22)');
        ctx.restore();
      }
      if (e.def.flying) {
        ctx.save();
        ctx.globalAlpha = 0.25;
        Art.groundQuad(ctx, e.x, e.y, 0.8, 0.8, 0, '#000000');
        ctx.restore();
      }
      if (e.def.capacity && e.cargo > 0) {
        ctx.save();
        ctx.fillStyle = e.cargoKind === 2 ? '#e8d24a' : '#c8a63a';
        ctx.fillRect(sx - 7, sy - 20, 14 * U.clamp(e.cargo / e.def.capacity, 0, 1), 3);
        ctx.strokeStyle = '#12140f';
        ctx.lineWidth = 1;
        ctx.strokeRect(sx - 7, sy - 20, 14, 3);
        ctx.restore();
      }
      Art.drawUnit(ctx, e.type, player.colorId, sx, sy, e.facing, e.turret);
      // 铁幕护罩
      if (e.invulnUntil && state.tick < e.invulnUntil) {
        ctx.save();
        ctx.globalAlpha = 0.55 + 0.25 * Math.sin(state.tick * 0.4 + e.id);
        ctx.strokeStyle = 'rgba(150,255,240,0.95)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse ? ctx.ellipse(sx, sy - 6, 14, 9, 0, 0, Math.PI * 2) : ctx.arc(sx, sy - 6, 11, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      if (e.rank > 0) {
        ctx.save();
        ctx.fillStyle = e.rank === 2 ? '#ffd85e' : '#d0e4ff';
        for (var k = 0; k < e.rank; k++) {
          ctx.beginPath();
          ctx.moveTo(sx - 4 + k * 6, sy - 24);
          ctx.lineTo(sx + 2 + k * 6, sy - 24);
          ctx.lineTo(sx - 1 + k * 6, sy - 19);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }
      if (e.flash > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = e.flash / 4 * 0.45;
        ctx.fillStyle = '#ffb060';
        ctx.beginPath();
        ctx.arc(sx, sy - 8, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      if (e.state === 'harvesting' || e.state === 'docking') {
        var pulse = 0.35 + 0.35 * Math.sin(state.tick * 0.25);
        ctx.save();
        ctx.globalAlpha = pulse;
        ctx.fillStyle = e.state === 'docking' ? '#8fe0ff' : '#ffd85e';
        ctx.beginPath();
        ctx.arc(sx, sy - 26, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawHealthBar(e) {
      var frac = U.clamp(e.hp / e.maxHp, 0, 1);
      if (frac >= 0.999 || frac <= 0) return;
      var p = Sim.entityPoint(e);
      var sx = Iso.sx(p.x, p.y);
      var sy = Iso.sy(p.x, p.y);
      var top = e.kind === 'building'
        ? sy - Art.buildingSize(e.type).oy * 0.55 - 10
        : sy - 30;
      var w = e.kind === 'building' ? 34 : 20;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(sx - w / 2 - 1, top - 1, w + 2, 5);
      ctx.fillStyle = frac > 0.6 ? '#4ce05a' : (frac > 0.3 ? '#e8d24a' : '#e04a3a');
      ctx.fillRect(sx - w / 2, top, w * frac, 3);
    }

    // -------------------------------------------------------------------
    // Projectiles and effects
    // -------------------------------------------------------------------
    function drawProjectiles(state) {
      for (var i = 0; i < state.projectiles.length; i++) {
        var pr = state.projectiles[i];
        if (pr.dead) continue;
        var sx = Iso.sx(pr.x, pr.y);
        var sy = Iso.sy(pr.x, pr.y) - 8;
        if (pr.type === 'rocket') {
          ctx.save();
          ctx.globalAlpha = 0.45;
          ctx.fillStyle = '#d8d8d8';
          ctx.beginPath();
          ctx.arc(sx - 5, sy + 2, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(sx - 11, sy + 4, 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          ctx.fillStyle = '#eeeeee';
          ctx.beginPath();
          ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#ffe8a0';
          ctx.beginPath();
          ctx.arc(sx, sy, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawEffects(state) {
      for (var i = 0; i < state.effects.length; i++) {
        var e = state.effects[i];
        var p = U.clamp(e.t / e.life, 0, 1);
        var sx = Iso.sx(e.x, e.y), sy = Iso.sy(e.x, e.y);
        if (e.type === 'explosion') {
          var size = (e.data && e.data.size) || 4;
          var r = size * (0.35 + p * 1.15);
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = (1 - p) * 0.9;
          ctx.fillStyle = p < 0.35 ? '#fff2b0' : (p < 0.7 ? '#ffa63a' : '#a03a12');
          ctx.beginPath();
          ctx.arc(sx, sy - 4, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = (1 - p) * 0.5;
          ctx.fillStyle = '#ff7a20';
          ctx.beginPath();
          ctx.arc(sx, sy - 4, r * 1.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          ctx.save();
          ctx.globalAlpha = (1 - p) * 0.8;
          ctx.fillStyle = '#5a4a38';
          for (var d = 0; d < 6; d++) {
            var a = (d / 6) * Math.PI * 2 + e.x;
            var dd = r * (0.8 + p * 1.5);
            ctx.fillRect(sx + Math.cos(a) * dd, sy - 4 + Math.sin(a) * dd * 0.5 - p * 12, 2, 2);
          }
          ctx.restore();
        } else if (e.type === 'muzzle') {
          var s2 = (e.data && e.data.size) || 1;
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = (1 - p) * 0.95;
          ctx.fillStyle = '#fff0b0';
          ctx.beginPath();
          ctx.arc(sx, sy - 10, 4.5 * s2 * (1 - p * 0.5), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else if (e.type === 'tracer') {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = (1 - p) * 0.9;
          ctx.strokeStyle = '#fff0a0';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(sx, sy - 10);
          ctx.lineTo(Iso.sx(e.data.x2, e.data.y2), Iso.sy(e.data.x2, e.data.y2) - 10);
          ctx.stroke();
          ctx.restore();
        } else if (e.type === 'beam') {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 1 - p;
          ctx.strokeStyle = 'rgba(120,220,255,0.9)';
          ctx.lineWidth = 4 * (1 - p * 0.4);
          ctx.beginPath();
          ctx.moveTo(sx, sy - 12);
          ctx.lineTo(Iso.sx(e.data.x2, e.data.y2), Iso.sy(e.data.x2, e.data.y2) - 10);
          ctx.stroke();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.restore();
        } else if (e.type === 'tesla') {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 1 - p;
          ctx.strokeStyle = 'rgba(200,240,255,0.95)';
          ctx.lineWidth = 2.5;
          var x0 = sx, y0 = sy - 26;
          var x1 = Iso.sx(e.data.x2, e.data.y2), y1 = Iso.sy(e.data.x2, e.data.y2) - 8;
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          var segs = 7;
          for (var s3 = 1; s3 <= segs; s3++) {
            var t2 = s3 / segs;
            var jitter = (s3 === segs) ? 0 : (((s3 * 37 + (e.data.seed || 0)) % 11) - 5) * 2.2;
            ctx.lineTo(U.lerp(x0, x1, t2) + jitter, U.lerp(y0, y1, t2) + jitter * 0.4);
          }
          ctx.stroke();
          ctx.restore();
        } else if (e.type === 'flakburst') {
          ctx.save();
          ctx.globalAlpha = (1 - p) * 0.7;
          ctx.fillStyle = '#4a4a4a';
          for (var f = 0; f < 4; f++) {
            var fa = f * 1.7;
            ctx.beginPath();
            ctx.arc(sx + Math.cos(fa) * p * 14, sy - 14 + Math.sin(fa) * p * 8, 3.5 * (1 - p * 0.5), 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        } else if (e.type === 'impact') {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = (1 - p) * 0.85;
          ctx.fillStyle = '#ffd070';
          ctx.beginPath();
          ctx.arc(sx, sy - 6, 3 + p * 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else if (e.type === 'capture') {
          ctx.save();
          ctx.globalAlpha = (1 - p) * 0.85;
          ctx.strokeStyle = '#7cff9a';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(sx, sy - 6, 8 + p * 34, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        } else if (e.type === 'promote') {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 1 - p;
          ctx.fillStyle = '#ffd85e';
          for (var c = 0; c < 3; c++) {
            var yy = sy - 16 - p * 24 - c * 6;
            ctx.beginPath();
            ctx.moveTo(sx - 4, yy);
            ctx.lineTo(sx + 4, yy);
            ctx.lineTo(sx, yy + 5);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        } else if (e.type === 'harvest') {
          ctx.save();
          ctx.globalAlpha = (1 - p) * 0.85;
          ctx.fillStyle = (e.data && e.data.kind === 2) ? '#e8d24a' : '#c8a63a';
          for (var h = 0; h < 3; h++) {
            var ha = h * 2.1 + e.x;
            ctx.fillRect(sx + Math.cos(ha) * 9, sy - 6 - p * 14 + Math.sin(ha) * 4, 3, 3);
          }
          ctx.restore();
        } else if (e.type === 'lightning') {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 1 - p;
          ctx.strokeStyle = 'rgba(210,240,255,0.95)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          var lx = sx, ly = sy, tx = sx, ty = sy - 80;
          ctx.moveTo(tx, ty);
          for (var ls = 1; ls <= 6; ls++) {
            var lt = ls / 6;
            var jit = (ls === 6) ? 0 : (((ls * 53 + e.x * 7) % 13) - 6) * 2.4;
            ctx.lineTo(U.lerp(tx, lx, lt) + jit, U.lerp(ty, ly, lt));
          }
          ctx.stroke();
          ctx.globalAlpha = (1 - p) * 0.5;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(sx, sy - 4, 8 * (1 - p), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else if (e.type === 'nukeFlash') {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = Math.max(0, 1 - p * 1.4);
          ctx.fillStyle = '#fff6c8';
          ctx.beginPath();
          ctx.arc(sx, sy - 8, 40 + p * 260, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = Math.max(0, 0.8 - p);
          ctx.strokeStyle = '#ffd070';
          ctx.lineWidth = 6 * (1 - p);
          ctx.beginPath();
          ctx.arc(sx, sy - 8, 30 + p * 300, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        } else if (e.type === 'chrono') {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = (1 - p) * 0.9;
          ctx.strokeStyle = 'rgba(150,230,255,0.95)';
          ctx.lineWidth = 2;
          for (var ci = 0; ci < 3; ci++) {
            ctx.beginPath();
            ctx.arc(sx, sy - e.t * 4, 6 + ci * 6 + p * 10, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.restore();
        } else if (e.type === 'iron') {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = (1 - p) * 0.8;
          ctx.strokeStyle = 'rgba(160,255,240,0.95)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(sx, sy - 6, 10 + p * 16, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        } else if (e.type === 'ironField') {
          ctx.save();
          ctx.globalAlpha = (1 - p) * 0.5;
          ctx.strokeStyle = 'rgba(150,255,240,0.8)';
          ctx.lineWidth = 2;
          var rr = (e.data && e.data.r) || 3.2;
          Art.groundQuad(ctx, e.x, e.y, rr * 2, rr * 2, 0, 'rgba(90,255,235,0.10)');
          ctx.strokeStyle = 'rgba(150,255,240,0.7)';
          ctx.beginPath();
          ctx.moveTo(Iso.sx(e.x - rr, e.y), Iso.sy(e.x - rr, e.y));
          ctx.lineTo(Iso.sx(e.x, e.y + rr), Iso.sy(e.x, e.y + rr));
          ctx.lineTo(Iso.sx(e.x + rr, e.y), Iso.sy(e.x + rr, e.y));
          ctx.lineTo(Iso.sx(e.x, e.y - rr), Iso.sy(e.x, e.y - rr));
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
        } else if (e.type === 'ironHit') {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 1 - p;
          ctx.fillStyle = '#a8fff0';
          ctx.beginPath();
          ctx.arc(sx, sy - 6, 4 + p * 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    /** 天气控制器的雷暴云 + 微闪。 */
    function drawStorms(state) {
      if (!state.storms || !state.storms.length) return;
      for (var i = 0; i < state.storms.length; i++) {
        var s = state.storms[i];
        var sx = Iso.sx(s.x, s.y), sy = Iso.sy(s.x, s.y);
        var flash = 0.10 + 0.06 * Math.sin(state.tick * 0.5 + i) +
          (state.tick % 7 === 0 ? 0.12 : 0);
        ctx.save();
        ctx.globalAlpha = U.clamp(flash, 0, 0.35);
        ctx.fillStyle = '#1b2430';
        ctx.beginPath();
        ctx.ellipse ? ctx.ellipse(sx, sy - 30, s.r * Art.TILE_W * 0.5, s.r * Art.TILE_H * 0.6, 0, 0, Math.PI * 2)
          : ctx.arc(sx, sy - 30, s.r * 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = 'rgba(120,160,200,0.5)';
        ctx.lineWidth = 1;
        Art.groundQuad(ctx, s.x, s.y, s.r * 2, s.r * 2, 0, 'rgba(90,140,190,0.10)');
        ctx.restore();
      }
    }

    function drawFog(state, playerIdx) {
      if (!state.fog) return;
      var player = state.players[playerIdx];
      var map = state.map;
      var r = visibleRange(map);
      var hw = Art.TILE_W / 2, hh = Art.TILE_H / 2;
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#05080c';
      ctx.beginPath();
      var any = false, x, y, i, sx, sy;
      for (y = r.y0; y <= r.y1; y++) {
        for (x = r.x0; x <= r.x1; x++) {
          i = y * map.w + x;
          if (player.visibility.explored[i] && !player.visibility.visible[i]) {
            sx = Iso.sx(x, y); sy = Iso.sy(x, y);
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx + hw, sy + hh);
            ctx.lineTo(sx, sy + Art.TILE_H);
            ctx.lineTo(sx - hw, sy + hh);
            ctx.closePath();
            any = true;
          }
        }
      }
      if (any) ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#030507';
      ctx.beginPath();
      any = false;
      for (y = r.y0; y <= r.y1; y++) {
        for (x = r.x0; x <= r.x1; x++) {
          i = y * map.w + x;
          if (!player.visibility.explored[i]) {
            sx = Iso.sx(x, y); sy = Iso.sy(x, y);
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx + hw, sy + hh);
            ctx.lineTo(sx, sy + Art.TILE_H);
            ctx.lineTo(sx - hw, sy + hh);
            ctx.closePath();
            any = true;
          }
        }
      }
      if (any) ctx.fill();
      ctx.restore();
    }

    // -------------------------------------------------------------------
    // Overlays (placement ghost, feedback, cursor)
    // -------------------------------------------------------------------
    function drawPlacementGhost(state, view) {
      var p = state.players[view.playerIdx];
      if (!p || !p.placing || !view.hoverTile) return;
      var def = Rules.get(p.placing.typeId);
      if (!def) return;
      var t = view.hoverTile;
      var check = Sim.canPlace(state, view.playerIdx, def.id, t.x, t.y);
      Art.groundQuad(ctx, t.x + def.w / 2, t.y + def.h / 2, def.w, def.h, 0,
        check.ok ? 'rgba(90,255,120,0.35)' : 'rgba(255,70,60,0.35)');
      ctx.save();
      ctx.strokeStyle = check.ok ? '#8dff9a' : '#ff6a5a';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.moveTo(Iso.sx(t.x, t.y), Iso.sy(t.x, t.y));
      ctx.lineTo(Iso.sx(t.x + def.w, t.y), Iso.sy(t.x + def.w, t.y));
      ctx.lineTo(Iso.sx(t.x + def.w, t.y + def.h), Iso.sy(t.x + def.w, t.y + def.h));
      ctx.lineTo(Iso.sx(t.x, t.y + def.h), Iso.sy(t.x, t.y + def.h));
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
      var spr = Art.buildingSprite(def.id, p.colorId);
      var size = Art.buildingSize(def.id);
      var sx = Math.round(Iso.sx(t.x + def.w / 2, t.y + def.h / 2) - size.ox);
      var sy = Math.round(Iso.sy(t.x + def.w / 2, t.y + def.h / 2) - size.oy);
      ctx.save();
      ctx.globalAlpha = check.ok ? 0.8 : 0.45;
      ctx.drawImage(spr, sx, sy);
      ctx.restore();
    }

    function drawCommandFeedback(view) {
      if (!view || !view.feedback) return;
      for (var i = 0; i < view.feedback.length; i++) {
        var f = view.feedback[i];
        var a = U.clamp(1 - f.t / f.life, 0, 1);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.strokeStyle = f.color || '#8dff9a';
        ctx.lineWidth = 2;
        var sx = Iso.sx(f.x, f.y), sy = Iso.sy(f.x, f.y);
        if (f.type === 'move') {
          var sz = 6 + (1 - a) * 8;
          ctx.beginPath();
          ctx.moveTo(sx - sz, sy - sz * 0.5);
          ctx.lineTo(sx + sz, sy - sz * 0.5);
          ctx.moveTo(sx, sy - sz);
          ctx.lineTo(sx, sy + sz * 0.5);
          ctx.stroke();
        } else if (f.type === 'attack' || f.type === 'deploy') {
          var r2 = 10 + (1 - a) * 12;
          ctx.beginPath();
          ctx.arc(sx, sy - 6, r2, 0, Math.PI * 2);
          ctx.stroke();
          if (f.type === 'attack') {
            ctx.beginPath();
            ctx.moveTo(sx - r2 - 4, sy - 6);
            ctx.lineTo(sx + r2 + 4, sy - 6);
            ctx.stroke();
          }
        }
        ctx.restore();
      }
    }

    function drawWaypointLines(state, view) {
      if (!view || !view.selected || !view.selected.size) return;
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = '#9dffb0';
      ctx.lineWidth = 1;
      for (var i = 0; i < state.units.length; i++) {
        var u = state.units[i];
        if (u.dead || !view.selected.has(u.id) || !u.path) continue;
        ctx.beginPath();
        ctx.moveTo(Iso.sx(u.x, u.y), Iso.sy(u.x, u.y));
        for (var k = Math.max(0, u.pathIdx); k < u.path.length; k++) {
          ctx.lineTo(Iso.sx(u.path[k].x, u.path[k].y), Iso.sy(u.path[k].x, u.path[k].y));
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawCursor(view) {
      if (!view || !view.cursor) return;
      var c = view.cursor;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.strokeStyle = c.color || '#e0f4ff';
      ctx.fillStyle = c.color || '#e0f4ff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(c.x + 11, c.y + 12);
      ctx.lineTo(c.x + 4, c.y + 12);
      ctx.lineTo(c.x + 4, c.y + 17);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      if (c.mode && c.mode !== 'move') {
        ctx.beginPath();
        ctx.arc(c.x + 16, c.y + 16, 11, 0, Math.PI * 2);
        ctx.stroke();
        if (c.mode === 'attack') {
          ctx.beginPath();
          ctx.moveTo(c.x + 8, c.y + 16);
          ctx.lineTo(c.x + 24, c.y + 16);
          ctx.moveTo(c.x + 16, c.y + 8);
          ctx.lineTo(c.x + 16, c.y + 24);
          ctx.stroke();
        } else if (c.mode === 'no') {
          ctx.beginPath();
          ctx.moveTo(c.x + 9, c.y + 9);
          ctx.lineTo(c.x + 23, c.y + 23);
          ctx.moveTo(c.x + 23, c.y + 9);
          ctx.lineTo(c.x + 9, c.y + 23);
          ctx.stroke();

<script>
/* src/render/minimap.js */
/*
 * Classic diamond radar/minimap.
 *   - terrain + ore layer is baked into an off-screen canvas and refreshed
 *     occasionally (ore gets mined out)
 *   - the fog layer is refreshed every few ticks
 *   - units and structures are drawn as coloured blips each frame
 *   - clicking or dragging moves the main camera
 */
(function (RA) {
  'use strict';

  var U = RA.Util;
  var Rules = RA.Rules;
  var T = RA.TERRAIN;
  var Minimap = RA.Minimap = {};

  var TERRAIN_COLORS = {
    0: '#1d4a70',
    1: '#3f6b36',
    2: '#5d6540',
    3: '#a2926a',
    4: '#6d6a5e',
    5: '#2f5a2c'
  };

  Minimap.create = function (canvas, state, playerIdx) {
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    var map = state.map;
    var s = Math.min((W - 10) / (map.w + map.h), (H - 10) / ((map.w + map.h) / 2));
    var origin = { x: W / 2, y: H / 2 - ((map.w + map.h) * s) / 4 + (map.h - map.w) * 0 };
    var base = RA.Art.canvas(W, H);
    var fogC = RA.Art.canvas(W, H);
    var lastBaseTick = -9999;
    var lastFogTick = -9999;

    function toMap(tx, ty) {
      return {
        x: origin.x + (tx - ty) * s * 0.5,
        y: origin.y + (tx + ty) * s * 0.25
      };
    }
    function toTile(mx, my) {
      var a = (mx - origin.x) / (s * 0.5);
      var b = (my - origin.y) / (s * 0.25);
      return { x: (b + a) / 2, y: (b - a) / 2 };
    }
    function clampOrigin() {
      origin.y = H / 2 - ((map.w + map.h) * s) / 4;
    }
    clampOrigin();

    function rebuildBase() {
      var g = base.getContext('2d');
      g.clearRect(0, 0, W, H);
      for (var y = 0; y < map.h; y++) {
        for (var x = 0; x < map.w; x++) {
          var p = toMap(x, y);
          var i = map.idx(x, y);
          g.fillStyle = TERRAIN_COLORS[map.terrain[i]] || '#3f6b36';
          g.fillRect(p.x - s * 0.5, p.y - s * 0.25, s, s * 0.5);
          if (map.ore[i] > 0) {
            g.fillStyle = map.oreKind[i] === 2 ? '#e8d24a' : '#c8a63a';
            g.fillRect(p.x - s * 0.25, p.y - s * 0.15, s * 0.5, s * 0.3);
          }
        }
      }
      lastBaseTick = state.tick;
    }

    function rebuildFog() {
      var g = fogC.getContext('2d');
      var player = state.players[playerIdx];
      g.clearRect(0, 0, W, H);
      if (!state.fog) return;
      for (var y = 0; y < map.h; y++) {
        for (var x = 0; x < map.w; x++) {
          var i = map.idx(x, y);
          if (player.visibility.visible[i]) continue;
          var p = toMap(x, y);
          g.fillStyle = player.visibility.explored[i] ? 'rgba(4,8,14,0.55)' : 'rgba(3,5,8,0.96)';
          g.fillRect(p.x - s * 0.5, p.y - s * 0.25, s + 0.5, s * 0.5 + 0.5);
        }
      }
      lastFogTick = state.tick;
    }

    function draw(state, view) {
      if (state.tick - lastBaseTick > 60) rebuildBase();
      if (state.tick - lastFogTick > 4) rebuildFog();
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#0a0f16';
      ctx.fillRect(0, 0, W, H);
      // 没有雷达站 / 空军指挥部 : 小地图不可用（与原版一致）
      var player = state.players[playerIdx];
      if (!player.hasRadar) {
        ctx.fillStyle = '#070c12';
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = 'rgba(120,150,180,0.25)';
        ctx.lineWidth = 1;
        for (var gy = 6; gy < H; gy += 7) {
          ctx.beginPath();
          ctx.moveTo(4, gy);
          ctx.lineTo(W - 4, gy);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(200,225,245,0.75)';
        ctx.font = '12px Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(RA.I18n.t('hud.radarOffline'), W / 2, H / 2);
        return;
      }
      ctx.drawImage(base, 0, 0);
      var i, e, p;
      // structures
      for (i = 0; i < state.buildings.length; i++) {
        e = state.buildings[i];
        if (e.dead) continue;
        if (state.fog && e.owner !== playerIdx && !RA.Sim.exploredAt(state, playerIdx, e.cx, e.cy)) continue;
        p = toMap(e.cx, e.cy);
        ctx.fillStyle = state.players[e.owner].color.hex;
        var sz = Math.max(2.5, (e.w + e.h) * s * 0.3);
        ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
        ctx.strokeStyle = 'rgba(0,0,0,0.6)';
        ctx.lineWidth = 1;
        ctx.strokeRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
      }
      // units
      for (i = 0; i < state.units.length; i++) {
        e = state.units[i];
        if (e.dead) continue;
        if (state.fog && e.owner !== playerIdx && !RA.Sim.visibleAt(state, playerIdx, e.x, e.y)) continue;
        p = toMap(e.x, e.y);
        ctx.fillStyle = state.players[e.owner].color.light;
        ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
      }
      ctx.drawImage(fogC, 0, 0);
      // camera rectangle
      if (view && view.renderer) {
        var cam = view.renderer.camera;
        var tl = view.renderer.screenToWorld(0, 0);
        var br = view.renderer.screenToWorld(view.renderer.canvas.width, view.renderer.canvas.height);
        var a = RA.Iso.toTile(tl.x, tl.y);
        var b = RA.Iso.toTile(br.x, br.y);
        var p1 = toMap(a.x, a.y);
        var p2 = toMap(b.x, b.y);
        var p3 = toMap(b.x, a.y);
        var p4 = toMap(a.x, b.y);
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.closePath();
        ctx.stroke();
      }
      void player;
    }

    return {
      canvas: canvas,
      draw: draw,
      toTile: toTile,
      toMap: toMap,
      /** Convert a click on the minimap into tile coordinates. */
      clickToTile: function (mx, my) {
        var t = toTile(mx, my);
        return { x: U.clamp(Math.floor(t.x), 0, map.w - 1), y: U.clamp(Math.floor(t.y), 0, map.h - 1) };

      rebuild: function () { rebuildBase(); rebuildFog(); }
    };
  };

</script>

 * All sound effects are synthesised with the Web Audio API - the project ships
 * no audio files at all.  Short envelopes on oscillators and filtered noise

  'use strict';

    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    g.connect(master);

<script>
/* src/ui/hud.js */
/*
 * The command sidebar: credits, power grid, build tabs, build buttons,
 * selection readout, radar and the alert ticker.  Pure DOM + CSS chrome,
 * populated from the simulation.
 */
(function (RA) {
  'use strict';

  var U = RA.Util;
  var Rules = RA.Rules;
  var Sim = RA.Sim;
  var T = function (key, params) { return RA.I18n.t(key, params); };

  var HUD = RA.Hud = {};

  HUD.create = function (root, opts) {
    opts = opts || {};
      var el = {
      credits: root.querySelector('#credits'),
      powerBar: root.querySelector('#powerBar i'),
      powerText: root.querySelector('#powerText'),
      tabs: root.querySelector('#tabs'),
      grid: root.querySelector('#buildGrid'),
      selection: root.querySelector('#selectionInfo'),
      alerts: root.querySelector('#alerts'),
      tooltip: root.querySelector('#tooltip'),
      minimap: root.querySelector('#minimap'),
      repair: root.querySelector('#btnRepair'),
      sell: root.querySelector('#btnSell'),
      timer: root.querySelector('#gameTimer'),
      faction: root.querySelector('#factionLabel'),
      superPanel: root.querySelector('#superPanel')
    };
    el.hint = root.querySelector('#hintBar');
    el.btnMenu = root.querySelector('#btnMenu');

    var state = null;
    var playerIdx = 0;
    var tab = 'structures';
    var buttons = {};
    var displayCredits = 0;
    var alerts = [];
    var minimap = null;
    var swButtons = {};

    /** Always work with the current game state (it changes between matches). */
    function sync() {
      if (opts.getState) state = opts.getState();
    }

    function buildTabs() {
      el.tabs.innerHTML = '';
      Rules.TAB_ORDER.forEach(function (t, i) {
        var b = document.createElement('button');
        b.className = 'tab';
        b.dataset.tab = t;
        b.innerHTML = '<span class="tabKey">' + (i + 1) + '</span>' + RA.I18n.tabName(t);
        b.title = RA.I18n.tabName(t);
        b.addEventListener('click', function () { setTab(t); });
        el.tabs.appendChild(b);
      });
    }

    function setTab(t) {
      tab = t;
      var nodes = el.tabs.querySelectorAll('.tab');
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].classList.toggle('active', nodes[i].dataset.tab === t);
      }
      buildGrid();
    }

    function buildGrid() {
      sync();
      if (!state) return;
      var p = state.players[playerIdx];
      var roster = Rules.roster(p.faction);
      var list = roster[tab] || [];
      el.grid.innerHTML = '';
      buttons = {};
      list.forEach(function (def) {
        if (def.id === 'conyard') return;      // never rebuilt once placed
        var b = document.createElement('button');
        b.className = 'buildItem';
        b.dataset.type = def.id;
        var icon = document.createElement('canvas');
        icon.width = 56; icon.height = 40;
        icon.className = 'icon';
        var src = RA.Art.iconSprite(def.id, p.colorId, 56, 40);
        icon.getContext('2d').drawImage(src, 0, 0);
        b.appendChild(icon);
        var cost = document.createElement('span');
        cost.className = 'cost';
        cost.textContent = '$' + def.cost;
        b.appendChild(cost);
        var name = document.createElement('span');
        name.className = 'bname';
        name.textContent = RA.I18n.defName(def);
        b.appendChild(name);
        b.title = RA.I18n.defName(def) + '  $' + def.cost;
        var prog = document.createElement('div');
        prog.className = 'progress';
        var inner = document.createElement('i');
        prog.appendChild(inner);
        b.appendChild(prog);
        b.addEventListener('click', function () { onBuildClick(def); });
        b.addEventListener('contextmenu', function (ev) {
          ev.preventDefault();
          if (Sim.queueState(state, playerIdx, def.id)) {
            Sim.cancelBuild(state, playerIdx, def.id);
            if (opts.onSound) opts.onSound('cancel');
          }
        });
        b.addEventListener('mouseenter', function () { showTooltip(def, b); });
        b.addEventListener('mouseleave', hideTooltip);
        el.grid.appendChild(b);
        buttons[def.id] = { node: b, def: def, progress: inner, icon: icon };
      });
    }

    function onBuildClick(def) {
      sync();
      if (!state) return;
      var p = state.players[playerIdx];
      var qs = Sim.queueState(state, playerIdx, def.id);
      if (qs && qs.item.ready) {
        if (p.placing && p.placing.typeId === def.id) Sim.cancelPlacement(state, playerIdx);
        else Sim.beginPlacement(state, playerIdx, def.id);
        if (opts.onSound) opts.onSound('click');
        return;
      }
      var check = Sim.canBuild(state, playerIdx, def.id);
      if (!check.ok) {
        if (check.soft) {
          addAlert(T('alert.insufficientFunds'), 'warn');
          if (RA.Voice) RA.Voice.speak('noFunds');
          if (opts.onSound) opts.onSound('nofunds');
        } else {
          addAlert(RA.I18n.reason(check), 'warn');
          if (opts.onSound) opts.onSound('deny');
        }
        return;
      }
      if (Sim.queueBuild(state, playerIdx, def.id)) {
        if (opts.onSound) opts.onSound('click');
      }
    }

    function showTooltip(def, node) {
      sync();
      if (!el.tooltip) return;
      var needs = Rules.prereqOf(def);
      var owned = {};
      for (var i = 0; i < state.buildings.length; i++) {
        var b = state.buildings[i];
        if (b.dead || b.owner !== playerIdx) continue;
        (b.def.tags || []).forEach(function (t) { owned[t] = true; });
      }
      var missing = needs.filter(function (n) { return !owned[n]; }).map(Sim.prereqName);
      var missingZh = needs.filter(function (n) { return !owned[n]; }).map(function (n) {
        return RA.I18n.prereqName(n);
      });
      var needList = RA.I18n.lang === 'zh' ? missingZh : missing;
      el.tooltip.innerHTML =
        '<b>' + RA.I18n.defName(def) + '</b><span class="cost">$' + def.cost + '</span>' +
        '<p>' + RA.I18n.defDesc(def) + '</p>' +
        (needList.length ? '<p class="warn">' + T('hud.requires') + ': ' + needList.join('、') + '</p>' : '') +
        (def.power ? '<p class="dim">' + T('hud.power') + ': ' + (def.power > 0 ? '+' : '') + def.power + '</p>' : '');
      el.tooltip.classList.add('show');
      var r = node.getBoundingClientRect();
      el.tooltip.style.left = Math.max(8, r.left - 268) + 'px';
      el.tooltip.style.top = Math.max(8, Math.min(window.innerHeight - 140, r.top - 10)) + 'px';
    }
    function hideTooltip() {
      if (el.tooltip) el.tooltip.classList.remove('show');
    }

    function addAlert(text, cls) {
      alerts.push({ text: text, cls: cls || '', t: 0, life: 4, node: null });
      while (alerts.length > 5) alerts.shift();
      renderAlerts();
    }
    HUD.addAlert = addAlert;

    function renderAlerts() {
      if (!el.alerts) return;
      el.alerts.innerHTML = '';
      alerts.forEach(function (a) {
        var d = document.createElement('div');
        d.className = 'alert ' + a.cls;
        d.textContent = a.text;
        el.alerts.appendChild(d);
        a.node = d;
      });
    }

    function updateAlerts(dt) {
      var changed = false;
      for (var i = alerts.length - 1; i >= 0; i--) {
        var a = alerts[i];
        a.t += dt;
        if (a.t > a.life) { alerts.splice(i, 1); changed = true; }
        else if (a.node) a.node.style.opacity = String(U.clamp((a.life - a.t) / 1.2, 0, 1));
      }
      if (changed) renderAlerts();
    }

    function update(stateRef, view, dt) {
      state = stateRef;
      sync();
      if (!minimap && el.minimap) {
        minimap = RA.Minimap.create(el.minimap, state, playerIdx);
        HUD.minimap = minimap;
      }
      var p = state.players[playerIdx];

      // credits roll towards the real value
      var target = p.credits;
      if (Math.abs(displayCredits - target) < 1) displayCredits = target;
      else displayCredits += (target - displayCredits) * Math.min(1, dt * 6);
      el.credits.textContent = U.formatMoney(displayCredits);
      el.credits.classList.toggle('low', p.credits < 100);

      // power
      var produced = p.power.produced, consumed = p.power.consumed;
      var frac = produced <= 0 ? 0 : U.clamp(consumed / produced, 0, 1);
      el.powerBar.style.width = (frac * 100).toFixed(0) + '%';
      el.powerBar.parentNode.classList.toggle('overload', p.power.low);
      var net = produced - consumed;
      el.powerText.textContent = (net >= 0 ? '+' : '') + net;
      el.powerText.classList.toggle('bad', net < 0);

      // build buttons
      for (var id in buttons) {
        var b = buttons[id];
        var qs = Sim.queueState(state, playerIdx, id);
        var check = Sim.canBuild(state, playerIdx, id);
        var node = b.node;
        node.classList.toggle('locked', !check.ok && !qs);
        node.classList.toggle('unaffordable', check.ok && p.credits < b.def.cost && !qs);
        node.classList.toggle('building', !!qs && !qs.item.ready);
        node.classList.toggle('ready', !!qs && qs.item.ready);
        node.classList.toggle('placing', !!(p.placing && p.placing.typeId === id));
        if (qs && !qs.item.ready) {
          var pct = U.clamp(qs.item.progress / b.def.buildTime, 0, 1) * 100;
          b.progress.style.width = pct.toFixed(1) + '%';
          node.classList.add('showProgress');
        } else {
          b.progress.style.width = '0%';
          node.classList.remove('showProgress');
        }
      }

      updateSelection(state, view);
      updateAlerts(dt);

      if (el.timer) {
        el.timer.textContent = U.formatTime(state.tick, Rules.TICKS_PER_SEC);
      }
      updateSuperPanel(state, view);
      if (el.faction) {
        el.faction.textContent = RA.I18n.factionName(p.faction);
      }
      if (el.hint) el.hint.textContent = T('hud.hint');
      if (el.btnMenu) el.btnMenu.textContent = T('hud.menu');
      if (el.repair) el.repair.innerHTML = T('hud.repair') + ' <span>R</span>';
      if (el.sell) el.sell.innerHTML = T('hud.sell') + ' <span>Del</span>';
      var creditsLabel = root.querySelector('.creditsPanel .label');
      if (creditsLabel) creditsLabel.textContent = T('hud.credits');
      var powerLabel = root.querySelector('.powerRow .label');
      if (powerLabel) powerLabel.textContent = T('hud.power');
      if (minimap) minimap.draw(state, { renderer: opts.getRenderer ? opts.getRenderer() : null });
      if (el.repair) el.repair.disabled = !hasSelectedBuilding(state, view);
      if (el.sell) el.sell.disabled = !hasSelectedBuilding(state, view);
    }

    /** 超级武器按钮：显示充能进度，充能完毕可以点击瞄准。 */
    function updateSuperPanel(state, view) {
      if (!el.superPanel) return;
      var list = Sim.superList(state, playerIdx);
      el.superPanel.innerHTML = '';
      swButtons = {};
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        var b = document.createElement('button');
        b.className = 'swBtn' + (s.ready ? ' ready' : '') +
          (view && view.armingSuper && view.armingSuper.key === s.key ? ' aiming' : '');
        b.dataset.swKey = s.key;
        b.title = T('sw.' + s.key) + ' - ' + s.desc;
        var icon = document.createElement('canvas');
        icon.width = 40; icon.height = 30;
        icon.className = 'swIcon';
        var src = RA.Art.iconSprite(s.buildingType, state.players[playerIdx].colorId, 40, 30);
        icon.getContext('2d').drawImage(src, 0, 0);
        b.appendChild(icon);
        var text = document.createElement('span');
        text.className = 'swText';
        var nm = document.createElement('span');
        nm.className = 'swName';
        nm.textContent = T('sw.' + s.key);
        var pct = document.createElement('span');
        pct.className = 'swPct';
        pct.textContent = s.ready ? T('sw.ready') : Math.floor(s.charge / s.max * 100) + '%';
        text.appendChild(nm);
        text.appendChild(pct);
        b.appendChild(text);
        var bar = document.createElement('div');
        bar.className = 'swBar';
        var fill = document.createElement('i');
        fill.style.width = U.clamp(s.charge / s.max, 0, 1) * 100 + '%';
        bar.appendChild(fill);
        b.appendChild(bar);
        b.addEventListener('click', (function (key) {
          return function () { if (opts.onSuperClick) opts.onSuperClick(key); };
        })(s.key));
        el.superPanel.appendChild(b);
      }
    }

    function hasSelectedBuilding(state, view) {
      if (!view || !view.selected) return false;
      var found = false;
      view.selected.forEach(function (id) {
        var e = Sim.byId(state, id);
        if (e && e.kind === 'building' && e.owner === playerIdx) found = true;
      });
      return found;
    }

    function updateSelection(state, view) {
      if (!el.selection) return;
      var ids = view && view.selected ? Array.from(view.selected) : [];
      var units = [], buildings = [];
      ids.forEach(function (id) {
        var e = Sim.byId(state, id);
        if (!e) return;
        if (e.kind === 'unit') units.push(e); else buildings.push(e);
      });
      if (!units.length && !buildings.length) {
        el.selection.innerHTML = '<div class="selEmpty">' + T('hud.noSelection') + '</div>';
        return;
      }
      var html = '';
      if (buildings.length === 1) {
        var b = buildings[0];
        html += '<div class="selTitle">' + RA.I18n.defName(b.def) + '</div>' +
          '<div class="selHp"><i style="width:' + (U.clamp(b.hp / b.maxHp, 0, 1) * 100).toFixed(0) + '%"></i></div>' +
          '<div class="selMeta">' + Math.round(b.hp) + ' / ' + Math.round(b.maxHp) + ' ' + T('hud.hp') +
          (b.repairing ? ' &middot; ' + T('hud.repairing') : '') + '</div>';
      } else if (units.length === 1) {
        var u = units[0];
        html += '<div class="selTitle">' + RA.I18n.defName(u.def) +
          (u.rank > 0 ? ' <span class="rank">' + RA.I18n.rankName(u.rank) + '</span>' : '') + '</div>' +
          '<div class="selHp"><i style="width:' + (U.clamp(u.hp / u.maxHp, 0, 1) * 100).toFixed(0) + '%"></i></div>' +
          '<div class="selMeta">' + Math.round(u.hp) + ' / ' + Math.round(u.maxHp) + ' ' + T('hud.hp') + '</div>';
        if (u.def.capacity) {
          html += '<div class="selMeta">' + T('hud.oreLoad') + ': ' + Math.round(u.cargo) + ' / ' + u.def.capacity + '</div>';
        }
        var w = Sim.primaryWeapon(u);
        if (w) {
          html += '<div class="selMeta dim">' + RA.I18n.weaponName(w) + ': ' + w.damage + ' ' + T('hud.damage') + ' / ' +
            w.range.toFixed(1) + ' ' + T('hud.tiles') + '</div>';
        }
      } else {
        var counts = {};
        units.concat(buildings).forEach(function (e) {
          counts[e.type] = (counts[e.type] || 0) + 1;
        });
        var parts = Object.keys(counts).map(function (t) {
          return counts[t] + ' × ' + RA.I18n.defName(Rules.get(t));
        });
        html += '<div class="selTitle">' + T('hud.selectedUnits', { n: units.length }) + '</div>';
        html += '<div class="selMeta">' + parts.slice(0, 3).join(', ') + '</div>';
      }
      el.selection.innerHTML = html;
    }

    buildTabs();
    setTab(tab);

    if (el.repair) {
      el.repair.addEventListener('click', function () { opts.onRepair && opts.onRepair(); });
    }
    if (el.sell) {
      el.sell.addEventListener('click', function () { opts.onSell && opts.onSell(); });
    }
    if (el.minimap) {
      var dragging = false;
      var handleMini = function (ev, isOrder) {
        var r = el.minimap.getBoundingClientRect();
        var t = minimap.clickToTile(
          (ev.clientX - r.left) * (el.minimap.width / r.width),
          (ev.clientY - r.top) * (el.minimap.height / r.height));
        if (isOrder) opts.onMinimapOrder && opts.onMinimapOrder(t);
        else opts.onMinimapJump && opts.onMinimapJump(t);
      };
      el.minimap.addEventListener('mousedown', function (ev) {
        if (ev.button === 0) { dragging = true; handleMini(ev, false); }
        else if (ev.button === 2) { ev.preventDefault(); handleMini(ev, true); }
      });
      window.addEventListener('mousemove', function (ev) { if (dragging) handleMini(ev, false); });
      window.addEventListener('mouseup', function () { dragging = false; });
      el.minimap.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    }

    return {
      update: update,
      setPlayer: function (idx) {
        playerIdx = idx;
        sync();
        buildGrid();
        if (minimap) minimap = RA.Minimap.create(el.minimap, state, playerIdx);
      },
      setTab: setTab,
      /** Re-render every piece of chrome after a language change. */
      setLanguage: function (lang) {
        RA.I18n.setLang(lang);
        sync();
        buildTabs();
        setTab(tab);
        if (el.hint) el.hint.textContent = T('hud.hint');
      },
      cycleTab: function (dir) {
        var i = Rules.TAB_ORDER.indexOf(tab);
        i = (i + dir + Rules.TAB_ORDER.length) % Rules.TAB_ORDER.length;
        setTab(Rules.TAB_ORDER[i]);
      },
      getTab: function () { return tab; },
      alert: addAlert,
      rebuild: buildGrid,
      getMinimap: function () { return minimap; }
    };
  };
})(globalThis.RA = globalThis.RA || {});

</script>
<script>
/* src/ui/input.js */
/*
 * Mouse & keyboard control: selection, orders, placement, camera and the
 * classic hotkeys (control groups, tabs, stop/guard/scatter, ...).
 */
(function (RA) {
  'use strict';

  var U = RA.Util;
  var Sim = RA.Sim;
  var Rules = RA.Rules;

  var Input = RA.Input = {};

  Input.create = function (opts) {
    var canvas = opts.canvas;
    var view = opts.view;
    var getState = opts.getState;
    var getRenderer = opts.getRenderer;
    var settings = opts.settings;
    var hud = opts.hud;

    var mouse = { x: 0, y: 0, inside: false };
    var dragging = false;
    var dragStart = null;
    var panning = false;
    var panLast = null;
    var keys = {};
    var lastClickTime = -1e9;   // the very first click is never a double click
    var attackMoveArmed = false;
    var edgeSpeed = 0;

    function state() { return getState(); }
    function renderer() { return getRenderer(); }
    function player() { return state().players[0]; }

    function localPos(ev) {
      var r = canvas.getBoundingClientRect();
      return {
        x: (ev.clientX - r.left) * (canvas.width / r.width),
        y: (ev.clientY - r.top) * (canvas.height / r.height)
      };
    }

    /** Entity under a screen point (units win over buildings). */
    function entityAt(sx, sy, playerIdx) {
      var st = state();
      var rendererRef = renderer();
      var best = null, bestD = 1e9;
      var i, e, p, s;
      for (i = 0; i < st.units.length; i++) {
        e = st.units[i];
        if (e.dead) continue;
        s = rendererRef.worldToScreen(RA.Iso.sx(e.x, e.y), RA.Iso.sy(e.x, e.y) - 6);
        var d = U.dist(s.x, s.y, sx, sy);
        if (d < 22 && d < bestD) { bestD = d; best = e; }
      }
      if (best) return best;
      var tile = rendererRef.tileAtScreen(sx, sy);
      for (i = 0; i < st.buildings.length; i++) {
        e = st.buildings[i];
        if (e.dead) continue;
        if (tile.x >= e.x && tile.x < e.x + e.w && tile.y >= e.y && tile.y < e.y + e.h) return e;
      }
      void p; void playerIdx;
      return null;
    }

    function selectedIds() { return Array.from(view.selected); }

    function setSelection(ids, additive) {
      if (!additive) view.selected.clear();
      ids.forEach(function (id) { view.selected.add(id); });
      if (opts.onSelectionChanged) opts.onSelectionChanged();
    }

    function selectGroupOf(unit) {
      // double-click: select every unit of the same type currently on screen
      var st = state();
      var r = renderer();
      var ids = [];
      var box = r.visibleRange(st.map);
      for (var i = 0; i < st.units.length; i++) {
        var u = st.units[i];
        if (u.dead || u.owner !== 0 || u.type !== unit.type) continue;
        if (u.x < box.x0 || u.x > box.x1 || u.y < box.y0 || u.y > box.y1) continue;
        ids.push(u.id);
      }
      setSelection(ids, false);
    }

    function issueOrderAt(sx, sy, additive) {
      var st = state();
      var target = entityAt(sx, sy, 0);
      var tile = renderer().tileAtScreen(sx, sy);
      var ids = selectedIds();
      if (!ids.length) return;
      if (attackMoveArmed) {
        attackMoveArmed = false;
        Sim.issueOrder(st, 0, ids, { type: 'attackMove', x: tile.fx, y: tile.fy });
        addFeedback('move', tile.fx, tile.fy, '#ffb84a');
        reply(ids, 'attackMove');
        return;
      }
      var orderType = target && target.owner !== 0 ? 'attack' : null;
      Sim.contextOrder(st, 0, ids, tile.fx, tile.fy, target ? target.id : 0);
      if (orderType === 'attack') {
        var p = Sim.entityPoint(target);
        addFeedback('attack', p.x, p.y, '#ff6a5a');
        reply(ids, 'attack');
      } else {
        addFeedback('move', tile.fx, tile.fy, '#8dff9a');
        reply(ids, 'move');
      }
      void additive;
    }

    /** Chinese voice acknowledgement from the units that were just ordered. */
    function reply(ids, command) {
      if (RA.Voice) RA.Voice.unitReply(state(), ids, command);
      if (opts.onSound) opts.onSound(command === 'attack' ? 'ackAttack' : 'ack');
    }

    /** 超级武器瞄准：点第一下（传送仪选起点），点第二下（选终点）。 */
    function fireArmedSuper(tile) {
      var st = state();
      var arm = view.armingSuper;
      if (!arm) return;
      if (arm.key === 'chronosphere' && arm.phase === 0) {
        arm.source = { x: tile.fx, y: tile.fy };
        arm.phase = 1;
        if (opts.onAlert) opts.onAlert(RA.I18n.t('alert.aimTarget'));
        addFeedback('deploy', tile.fx, tile.fy, '#8fe0ff');
        return;
      }
      var res = Sim.fireSuper(st, 0, arm.key,
        arm.source ? arm.source.x : tile.fx,
        arm.source ? arm.source.y : tile.fy,
        tile.fx, tile.fy);
      if (res.ok) {
        addFeedback('deploy', tile.fx, tile.fy, '#ffb84a');
        if (opts.onSound) opts.onSound('ackAttack');
      } else {
        if (opts.onSound) opts.onSound('deny');
        if (opts.onAlert) opts.onAlert(res.reason || RA.I18n.t('reason.unavailable'));
      }
      view.armingSuper = null;
    }

    function addFeedback(type, x, y, color) {
      view.feedback.push({ type: type, x: x, y: y, t: 0, life: 0.7, color: color });
      if (view.feedback.length > 12) view.feedback.shift();
    }
    Input.addFeedback = addFeedback;

    function tryPlace(tile) {
      var st = state();
      var p = st.players[0];
      if (!p.placing) return false;
      var res = Sim.placeBuilding(st, 0, p.placing.typeId, tile.x, tile.y);
      if (res.ok) {
        if (RA.Voice) RA.Voice.speak('place');
        if (opts.onSound) opts.onSound('place');
        hud && hud.rebuild();
        return true;
      }
      if (opts.onSound) opts.onSound('deny');
      if (RA.Voice) RA.Voice.speak('deny', { force: true });
      hud && hud.alert(RA.I18n.reason(res) || RA.I18n.t('alert.cannotBuild'), 'warn');
      return true;
    }

    // ------------------------------------------------------------------
    // Mouse
    // ------------------------------------------------------------------
    canvas.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });

    canvas.addEventListener('mousedown', function (ev) {
      var p = localPos(ev);
      mouse.x = p.x; mouse.y = p.y;
      var st = state();
      if (ev.button === 0) {
        // 超级武器瞄准中：左键确定目标点
        if (view.armingSuper) {
          fireArmedSuper(renderer().tileAtScreen(p.x, p.y));
          return;
        }
        if (st.players[0].placing) {
          var t = renderer().tileAtScreen(p.x, p.y);
          tryPlace(t);
          return;
        }
        var now = performance.now();
        var target = entityAt(p.x, p.y, 0);
        if (target && now - lastClickTime < 320 && target.kind === 'unit' && target.owner === 0) {
          selectGroupOf(target);
          lastClickTime = 0;
          return;
        }
        lastClickTime = now;
        dragging = true;
        dragStart = { x: p.x, y: p.y };
        view.dragRect = { x: p.x, y: p.y, w: 0, h: 0 };
      } else if (ev.button === 1) {
        panning = true;
        panLast = { x: ev.clientX, y: ev.clientY };
        ev.preventDefault();
      }
    });

    window.addEventListener('mousemove', function (ev) {
      if (panning && panLast) {
        var cam = renderer().camera;
        cam.x -= (ev.clientX - panLast.x) / cam.zoom;
        cam.y -= (ev.clientY - panLast.y) / cam.zoom;
        renderer().clampCamera(state().map);
        panLast = { x: ev.clientX, y: ev.clientY };
      }
    });

    canvas.addEventListener('mousemove', function (ev) {
      var p = localPos(ev);
      mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
      view.cursor = { x: p.x, y: p.y };
      var t = renderer().tileAtScreen(p.x, p.y);
      view.hoverTile = t;
      var st = state();
      var hovered = entityAt(p.x, p.y, 0);
      view.hoverId = hovered ? hovered.id : 0;
      // cursor mode
      var mode = 'move';
      var color = '#dff4ff';
      if (view.armingSuper) {
        mode = 'deploy';
        color = '#ffb84a';
      } else if (st.players[0].placing) {
        var chk = Sim.canPlace(st, 0, st.players[0].placing.typeId, t.x, t.y);
        mode = chk.ok ? 'place' : 'no';
        color = chk.ok ? '#9dffb0' : '#ff7a6a';
      } else if (attackMoveArmed) {
        mode = 'attack';
        color = '#ffb84a';
      } else if (hovered && hovered.owner !== 0) {
        mode = 'attack';
        color = '#ff8a7a';
      } else if (hovered && hovered.owner === 0 && hovered.type === 'refinery' &&
        selectedIds().some(function (id) {
          var u = Sim.byId(st, id);
          return u && u.def.capacity;
        })) {
        mode = 'harvest';
        color = '#ffd85e';
      } else if (hovered && hovered.owner !== 0 && hovered.kind === 'building' &&
        selectedIds().some(function (id) {
          var u = Sim.byId(st, id);
          return u && u.def.abilities && u.def.abilities.indexOf('capture') >= 0;
        })) {
        mode = 'capture';
        color = '#9dffb0';
      } else if (st.map.oreAt(t.x, t.y) > 0) {
        mode = 'harvest';
        color = '#ffd85e';
      }
      view.cursor.mode = mode;
      view.cursor.color = color;
      if (dragging && dragStart) {
        view.dragRect = {
          x: Math.min(dragStart.x, p.x), y: Math.min(dragStart.y, p.y),
          w: Math.abs(p.x - dragStart.x), h: Math.abs(p.y - dragStart.y)
        };
      }
    });

    canvas.addEventListener('mouseleave', function () {
      mouse.inside = false;
      view.cursor = null;
      view.hoverTile = null;
      view.hoverId = 0;
    });

    canvas.addEventListener('mouseup', function (ev) {
      if (ev.button !== 0) return;
      var p = localPos(ev);
      if (!dragging) return;
      dragging = false;
      var rect = view.dragRect;
      view.dragRect = null;
      var st = state();
      if (rect && (rect.w > 8 || rect.h > 8)) {
        var r = renderer();
        var ids = [];
        for (var i = 0; i < st.units.length; i++) {
          var u = st.units[i];
          if (u.dead || u.owner !== 0) continue;
          var s = r.worldToScreen(RA.Iso.sx(u.x, u.y), RA.Iso.sy(u.x, u.y));
          if (s.x >= rect.x && s.x <= rect.x + rect.w && s.y >= rect.y && s.y <= rect.y + rect.h) ids.push(u.id);
        }
        setSelection(ids, ev.shiftKey);
        if (opts.onSound && ids.length) opts.onSound('select');
        return;
      }
      var target = entityAt(p.x, p.y, 0);
      if (target) {
        setSelection([target.id], ev.shiftKey);
        if (opts.onSound) opts.onSound('select');
      } else if (!ev.shiftKey) {
        view.selected.clear();
      }
    });

    canvas.addEventListener('mousedown', function (ev) {
      if (ev.button === 2) {
        var p = localPos(ev);
        var st = state();
        if (st.players[0].placing) {
          Sim.cancelPlacement(st, 0);
          if (opts.onSound) opts.onSound('cancel');
          return;
        }
        if (attackMoveArmed) { attackMoveArmed = false; return; }
        issueOrderAt(p.x, p.y, ev.shiftKey);
      }
    });

    canvas.addEventListener('wheel', function (ev) {
      ev.preventDefault();
      var p = localPos(ev);
      renderer().zoomBy(ev.deltaY < 0 ? 1.12 : 0.9, state().map, p.x, p.y);
    }, { passive: false });

    // ------------------------------------------------------------------
    // Keyboard
    // ------------------------------------------------------------------
    view.groups = view.groups || {};

    window.addEventListener('keydown', function (ev) {
      var tag = (ev.target && ev.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      keys[ev.key.toLowerCase()] = true;
      var st = state();
      var k = ev.key.toLowerCase();
      var cam = renderer().camera;
      var speed = 420 / cam.zoom;
      var handled = true;

      if (ev.key === 'Escape') {
        if (view.armingSuper) view.armingSuper = null;
        else if (st.players[0].placing) Sim.cancelPlacement(st, 0);
        else if (attackMoveArmed) attackMoveArmed = false;
        else opts.onPause && opts.onPause();
      } else if (k >= '1' && k <= '9') {
        var idx = k;
        if (ev.ctrlKey) {
          view.groups[idx] = selectedIds();
          opts.onAlert && opts.onAlert(RA.I18n.t('alert.groupSet', { n: idx, count: view.groups[idx].length }));
        } else {
          var ids = (view.groups[idx] || []).filter(function (id) { return !!Sim.byId(st, id); });
          if (ids.length) {
            setSelection(ids, false);
            var first = Sim.byId(st, ids[0]);
            if (first && ev.altKey) {
              var pt = Sim.entityPoint(first);
              renderer().centerOn(st.map, pt.x, pt.y);
            }
          }
        }
      } else if (k === 'q') hud && hud.cycleTab(-1);
      else if (k === 'e') hud && hud.cycleTab(1);
      else if (k === 'h' || k === 'home') {
        var base = ownBuilding(st, 'conyard') || ownBuilding(st, null);
        if (base) renderer().centerOn(st.map, base.cx, base.cy);
      } else if (k === 's') {
        Sim.issueOrder(st, 0, selectedIds(), { type: 'stop' });
        reply(selectedIds(), 'stop');
      } else if (k === 'g') {
        Sim.issueOrder(st, 0, selectedIds(), { type: 'guard' });
        reply(selectedIds(), 'guard');
      } else if (k === 'x') {
        Sim.issueOrder(st, 0, selectedIds(), { type: 'scatter' });
        reply(selectedIds(), 'scatter');
      }
      else if (k === 'a' && !ev.ctrlKey) { attackMoveArmed = true; }
      else if (k === 'r') opts.onRepair && opts.onRepair();
      else if (ev.key === 'Delete') opts.onSell && opts.onSell();
      else if (k === ' ') {
        if (view.lastAlertPos) renderer().centerOn(st.map, view.lastAlertPos.x, view.lastAlertPos.y);
      } else if (ev.key === 'ArrowLeft' || k === 'arrowleft') cam.x -= speed * 0.4;
      else if (ev.key === 'ArrowRight' || k === 'arrowright') cam.x += speed * 0.4;
      else if (ev.key === 'ArrowUp' || k === 'arrowup') cam.y -= speed * 0.4;
      else if (ev.key === 'ArrowDown' || k === 'arrowdown') cam.y += speed * 0.4;
      else if (k === '+') renderer().zoomBy(1.1, st.map);
      else if (k === '-') renderer().zoomBy(0.9, st.map);
      else handled = false;
      if (handled) {
        if (k.indexOf('arrow') === 0 || k === 'arrowleft' || k === 'arrowright' || k === 'arrowup' || k === 'arrowdown') {
          renderer().clampCamera(st.map);
        }
        ev.preventDefault();
      }
    });
    window.addEventListener('keyup', function (ev) { keys[ev.key.toLowerCase()] = false; });
    window.addEventListener('blur', function () { keys = {}; dragging = false; panning = false; });

    function ownBuilding(st, type) {
      for (var i = 0; i < st.buildings.length; i++) {
        var b = st.buildings[i];
        if (b.dead || b.owner !== 0) continue;
        if (type && b.type !== type) continue;
        return b;
      }
      return null;
    }

    function update(dt) {
      var st = state();
      var cam = renderer().camera;
      var margin = 24;
      var speed = (settings ? settings.scrollSpeed : 700) / cam.zoom;
      if (settings && settings.edgeScroll !== false && mouse.inside && !panning) {
        var dx = 0, dy = 0;
        if (mouse.x < margin) dx = -1;
        else if (mouse.x > canvas.width - margin) dx = 1;
        if (mouse.y < margin) dy = -1;
        else if (mouse.y > canvas.height - margin) dy = 1;
        if (dx || dy) {
          cam.x += dx * speed * dt;
          cam.y += dy * speed * dt;
          renderer().clampCamera(st.map);
        }
      }
      var ks = speed * dt * 1.2;
      if (keys['arrowup']) cam.y -= ks;
      if (keys['arrowleft']) cam.x -= ks;
      if (keys['arrowright']) cam.x += ks;
      if (keys['arrowdown']) cam.y += ks;
      renderer().clampCamera(st.map);
      // feedback lifetime
      for (var i = view.feedback.length - 1; i >= 0; i--) {
        var f = view.feedback[i];
        f.t += dt;
        if (f.t >= f.life) view.feedback.splice(i, 1);
      }
      edgeSpeed = 0;
      void edgeSpeed;
    }

    return {
      update: update,
      isAttackMoveArmed: function () { return attackMoveArmed; },
      setAttackMoveArmed: function (v) { attackMoveArmed = v; },
      mouse: mouse
    };
  };
})(globalThis.RA = globalThis.RA || {});

<script>
/* src/ui/screens.js */

  Screens.options = function (root, settings, opts) {

        out.textContent = input.value;
        onChange(Number(input.value));
      });
      row.appendChild(input);
      row.appendChild(out);
      return row;
    }
    function toggle(label, value, onChange) {
      var row = el('label', 'optRow');
      row.appendChild(el('span', 'optLabel', label));

        value = !value;
        b.textContent = value ? T('common.on') : T('common.off');

        onChange(value);
      });
      row.appendChild(b);

    actions.appendChild(button(T('common.back'), 'primary', function () { opts.onBack(); }, 'back'));
    panel.appendChild(actions);

  };

  Screens.about = function (root, opts) {
    var o = overlay(root, 'about');

  Screens.pause = function (root, opts) {

    menu.appendChild(button(T('menu.options'), '', function () { opts.onOptions(); }, 'options'));
    menu.appendChild(button(T('common.restart'), '', function () { opts.onRestart(); }, 'restart'));
    menu.appendChild(button(T('common.quit'), '', function () { opts.onQuit(); }, 'quit'));
    panel.appendChild(menu);
    o.appendChild(panel);
  };

  Screens.results = function (root, result, opts) {
    var o = overlay(root, 'results ' + (result.win ? 'win' : 'lose'));
    var panel = el('div', 'menuPanel wide');
    panel.appendChild(el('h2', 'screenTitle', result.win ? T('common.win') : T('common.lose')));
    var st = result.stats;
    var grid = el('div', 'statGrid');
    var rows = [
      [T('results.time'), U.formatTime(result.ticks, Rules.TICKS_PER_SEC)],
      [T('results.unitsBuilt'), st.unitsBuilt],
      [T('results.unitsLost'), st.unitsLost],
      [T('results.kills'), st.kills],
      [T('results.buildingsBuilt'), st.buildingsBuilt],
      [T('results.structuresLost'), st.structuresLost],
      [T('results.ore'), U.formatMoney(st.oreHarvested)],
      [T('results.credits'), U.formatMoney(st.creditsEarned)],
      [T('results.peak'), st.peakArmy]
    ];
    rows.forEach(function (r) {
      grid.appendChild(el('div', 'statKey', r[0]));
      grid.appendChild(el('div', 'statVal', String(r[1])));
    });
    panel.appendChild(grid);
    if (result.shareUrl) {
      var share = el('div', 'shareBox');
      share.appendChild(el('span', null, T('results.share')));
      var input = el('input', 'shareInput');
      input.value = result.shareUrl;
      input.readOnly = true;
      input.addEventListener('click', function () { input.select(); });
      share.appendChild(input);
      panel.appendChild(share);
    }
    var menu = el('div', 'menuButtons row');
    menu.appendChild(button(T('common.menu'), '', function () { opts.onMenu(); }, 'menu'));
    menu.appendChild(button(T('common.rematch'), 'primary', function () { opts.onRestart(); }, 'rematch'));
    panel.appendChild(menu);
    o.appendChild(panel);
  };

  Screens.loading = function (root, text) {
    var o = overlay(root, 'loading');
    var panel = el('div', 'menuPanel small');
    panel.appendChild(el('h2', 'screenTitle', T('skirmish.battlefield') + '...'));
    panel.appendChild(el('p', 'hint', text || ''));
    o.appendChild(panel);
  };
})(globalThis.RA = globalThis.RA || {});
