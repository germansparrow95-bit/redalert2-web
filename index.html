<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Alert Web - browser skirmish</title>
<meta name="description" content="A complete browser skirmish game in the classic isometric real-time strategy style. Original code and procedural art.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="game">
  <div id="viewport">
    <canvas id="world" width="800" height="600"></canvas>
    <div id="alerts"></div>
    <div id="topbar">
      <span id="factionLabel">Allied</span>
      <span id="gameTimer">0:00</span>
      <button id="btnMenu" title="Pause menu (Esc)">MENU</button>
    </div>
    <div id="hintBar">Left click selects &middot; right click orders &middot; Q/E switch tabs &middot; Esc pauses</div>
  </div>

  <aside id="sidebar">
    <div class="panel creditsPanel">
      <div class="row">
        <span class="label">CREDITS</span>
        <span id="credits">$10,000</span>
      </div>
      <div class="row powerRow">
        <span class="label">POWER</span>
        <div class="powerBar" id="powerBar"><i></i></div>
        <span id="powerText">+0</span>
      </div>
    </div>
    <nav id="tabs"></nav>
    <div id="buildGrid"></div>
    <div id="selectionInfo" class="panel"></div>
    <div id="minimapPanel" class="panel">
      <canvas id="minimap" width="188" height="120"></canvas>
    </div>
    <div id="superPanel" class="panel"></div>
    <div id="actions" class="panel">
      <button id="btnRepair" class="action">REPAIR <span>R</span></button>
      <button id="btnSell" class="action">SELL <span>Del</span></button>
    </div>
  </aside>

  <div id="overlay" class="overlay"></div>
  <div id="tooltip"></div>
</div>

<script src="src/core/util.js"></script>
<script src="src/core/rules.js"></script>
<script src="src/core/map.js"></script>
<script src="src/core/pathfind.js"></script>
<script src="src/core/sim.js"></script>
<script src="src/core/ai.js"></script>
<script src="src/render/art.js"></script>
<script src="src/render/iso.js"></script>
<script src="src/render/renderer.js"></script>
<script src="src/render/minimap.js"></script>
<script src="src/audio/sfx.js"></script>
<script src="src/audio/voice.js"></script>
<script src="src/ui/i18n.js"></script>
<script src="src/ui/hud.js"></script>
<script src="src/ui/input.js"></script>
<script src="src/ui/screens.js"></script>
<script src="src/main.js"></script>
</body>
</html>
